<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPX Truck Lock GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#EEF1F6;
  --navy:#131F38;
  --navy-2:#1D2D4D;
  --navy-3:#28406B;
  --accent:#E28F35;
  --accent-dark:#C97620;
  --accent-bg:#FCEBD6;
  --success:#1F8B4C;
  --success-bg:#E2F5EA;
  --warning:#B4740E;
  --warning-bg:#FBEED4;
  --slate:#5B6478;
  --slate-bg:#E8EBF0;
  --danger:#C0392B;
  --danger-bg:#FBEAE8;
  --border:#DDE2EA;
  --text:#131A2A;
  --text-dim:#5B6478;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-bg);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(226,143,53,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(40,64,107,0.12), transparent 45%),
    var(--navy);
  padding:24px;
}
.login-card{
  background:var(--surface);
  width:100%;
  max-width:420px;
  border-radius:14px;
  padding:38px 36px 32px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  position:relative;
  overflow:hidden;
}
.login-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 48%,var(--accent) 48%,var(--accent) 100%);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;margin-bottom:6px;
}
.seal-icon{width:36px;height:36px;flex-shrink:0;}
.brand-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:-0.02em;
  color:var(--navy);
}
.brand-sub{
  font-size:12.5px;
  color:var(--text-dim);
  margin:0 0 28px;
  padding-left:46px;
  letter-spacing:0.02em;
}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;
}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14.5px;color:var(--text);background:var(--surface);transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none;border-color:var(--navy-3);
}
.btn{
  border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s, box-shadow .15s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-ghost:hover{background:#E1E5EC;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:#F6D5D1;}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-success:hover{background:#CFEEDC;}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn:disabled{opacity:0.42;cursor:not-allowed;}
.login-btn{margin-top:6px;}
.login-hint{
  margin-top:20px;padding:12px 14px;background:var(--surface-2);border-radius:8px;
  font-size:12.5px;color:var(--text-dim);line-height:1.5;
}
.login-hint b{color:var(--text);font-family:var(--font-mono);}
.login-error{
  background:var(--danger-bg);color:var(--danger);font-size:13px;padding:10px 12px;
  border-radius:8px;margin-bottom:16px;font-weight:500;
}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:18px;}
.sb-brand .seal-icon{width:28px;height:28px;}
.sb-brand-text{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.02em;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:rgba(255,255,255,0.72);font-size:14px;font-weight:500;margin-bottom:3px;
  background:none;border:none;width:100%;text-align:left;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;}
.nav-item svg{flex-shrink:0;width:17px;height:17px;}
.sb-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.sb-user{padding:8px 10px;font-size:12.5px;color:rgba(255,255,255,0.65);margin-bottom:8px;}
.sb-user b{color:#fff;display:block;font-size:13.5px;margin-bottom:1px;}
.tag-pill{
  display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;padding:2px 7px;border-radius:20px;margin-top:4px;
}
.tag-admin{background:var(--accent);color:#fff;}
.tag-dest{background:rgba(255,255,255,0.14);color:#fff;}

.main{flex:1;min-width:0;padding:26px 32px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-0.01em;margin:0;}
.page-sub{color:var(--text-dim);font-size:13.5px;margin:3px 0 0;}

/* ---------- Cards / summary ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 18px 16px;
  position:relative;overflow:hidden;cursor:pointer;user-select:none;
  transition:transform .1s ease, box-shadow .15s ease, border-color .15s ease;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(19,31,56,0.25);}
.stat-card:active{transform:translateY(0);}
.stat-card:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px;}
.stat-card.is-active{border-color:var(--navy-3);box-shadow:0 0 0 2px rgba(29,45,77,0.14);}
.stat-card::after{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;}
.stat-card.c-total::after{background:var(--navy-3);}
.stat-card.c-available::after{background:var(--slate);}
.stat-card.c-assigned::after{background:var(--warning);}
.stat-card.c-received::after{background:var(--success);}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);font-weight:600;}
.stat-value{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:6px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
.panel-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;margin:0 0 4px;}
.panel-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 14px;}

/* ---------- Table ---------- */
.table-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.table-toolbar .grow{flex:1;min-width:160px;}
.search-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;}
.search-input:focus{outline:none;border-color:var(--navy-3);}
.filter-select{padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px;}
thead th{
  background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11px;
  text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid #EEF0F4;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.mono{font-family:var(--font-mono);font-weight:600;letter-spacing:0.01em;}
.empty-row td{text-align:center;padding:36px 12px;color:var(--text-dim);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-available{background:var(--slate-bg);color:var(--slate);}
.badge-assigned{background:var(--warning-bg);color:var(--warning);}
.badge-received{background:var(--success-bg);color:var(--success);}
.badge-returning{background:#ede9fe;color:#6d28d9;}
.stat-card.c-returning::after{background:#8b5cf6;}

.action-row{display:flex;gap:6px;flex-wrap:wrap;}
.row-check{width:16px;height:16px;accent-color:var(--navy);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,20,35,0.55);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);
}
.modal{
  background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;
  overflow-y:auto;box-shadow:0 30px 70px -15px rgba(0,0,0,0.4);
}
.modal-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0;}
.modal-sub{font-size:12.5px;color:var(--text-dim);margin:4px 0 0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-dim);line-height:1;padding:4px;}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:110px;overflow-y:auto;padding:2px;}
.chip{background:var(--surface-2);border-radius:20px;padding:4px 10px;font-size:12px;font-family:var(--font-mono);font-weight:600;}
.upload-drop{
  border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;background:var(--surface-2);
}
.upload-drop input[type=file]{display:block;margin:10px auto 0;font-size:12.5px;}
.divider-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;}
.divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}
.helper-text{font-size:11.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
.template-link{font-size:12px;color:var(--navy-3);font-weight:600;text-decoration:underline;background:none;border:none;padding:0;}

/* ---------- Allocation ---------- */
.alloc-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.alloc-lock-chips{display:flex;flex-wrap:wrap;gap:5px;max-width:420px;}
.alloc-lock-chips .chip{padding:2px 8px;font-size:11.5px;}
.chip-more{background:var(--accent-bg);color:var(--accent-dark);border:none;cursor:pointer;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;}
.qty-num{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.bal-ok{color:var(--success);} .bal-low{color:var(--warning);} .bal-over{color:var(--danger);}
.prog{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px;min-width:90px;}
.prog>div{height:100%;background:var(--success);}
.prog.over>div{background:var(--danger);}
.badge-noquota{background:var(--surface-2);color:var(--text-dim);}

.chip-res{background:#fff !important;border:1px dashed var(--slate);color:var(--slate);}

.dest-stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.stat-breakdown{margin-top:10px;display:grid;gap:3px;font-size:12px;color:var(--text-dim);}
.stat-breakdown span{display:flex;justify-content:space-between;gap:10px;}
.stat-breakdown em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-breakdown b{color:var(--text);font-family:var(--font-mono);}
.stat-card:not([role="button"]){cursor:default;}
.stat-card:not([role="button"]):hover{transform:none;box-shadow:none;}

.stat-sub{font-size:12px;color:var(--text-dim);margin-top:2px;}
.stat-extra{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;padding:7px 10px;border-radius:8px;background:var(--surface-2);font-size:12px;font-weight:600;}
.stat-extra b{font-family:var(--font-mono);font-size:15px;color:var(--navy-3);}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface);}
.seg button{border:none;background:transparent;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;font-family:inherit;}
.seg button+button{border-left:1px solid var(--border);}
.seg button.is-on{background:var(--navy-3);color:#fff;}
.usage-legend{display:flex;gap:16px;font-size:12px;color:var(--text-dim);margin:12px 0 8px;flex-wrap:wrap;}
.usage-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.usage-chart{max-height:420px;overflow-y:auto;padding-right:6px;}
.usage-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr;gap:12px;align-items:center;padding:6px 0;}
.usage-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.usage-bars{display:grid;gap:3px;}
.usage-bar{height:14px;border-radius:4px;min-width:0;display:flex;align-items:center;}
.usage-bar.a{background:var(--warning);}
.usage-bar.r{background:var(--success);}
.usage-bar span{font-size:11px;font-weight:700;font-family:var(--font-mono);color:var(--text);margin-left:calc(100% + 6px);white-space:nowrap;}
.usage-track{position:relative;}

.assign-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:start;}
.assign-grid .field{margin-bottom:0;}
.remain-badge{float:right;padding:1px 9px;border-radius:20px;background:var(--accent-bg);color:var(--accent-dark);font-size:11.5px;font-weight:700;letter-spacing:0;text-transform:none;}
.assign-info{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:12.5px;}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--navy-3);color:#fff;font-size:11px;font-weight:700;margin-right:6px;}

.mod-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;}
.mod-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);}
.mod-opt input{width:auto;margin:0;}
.mod-opt.is-off{opacity:0.45;cursor:not-allowed;}
.mod-mini{display:flex;flex-wrap:wrap;gap:4px;max-width:360px;}
.mod-mini .chip{padding:2px 8px;font-size:11.5px;}

.ph-wrap{display:grid;grid-template-columns:minmax(250px,400px) 1fr;gap:18px;align-items:start;}
@media(max-width:860px){.ph-wrap{grid-template-columns:1fr;}}
.ph-svg{display:block;width:100%;height:auto;background:var(--surface-2);border-radius:12px;touch-action:none;cursor:grab;user-select:none;}
.ph-svg.is-drag{cursor:grabbing;}
.ph-locks,.ph-lbl{display:none;}
.ph-z3 .ph-agg{display:none;}
.ph-z3 .ph-locks{display:inline;}
.ph-z6 .ph-lbl{display:inline;}
.ph-mapbox{position:relative;}
.ph-zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;}
.ph-zoom button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;line-height:1;}
.ph-zoom button:hover{background:var(--accent-bg);}
.ph-hint{position:absolute;left:8px;bottom:8px;font-size:11px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px;}
.ph-lk{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--accent-dark);cursor:pointer;text-align:left;}
.ph-lk:hover{text-decoration:underline;}
.ph-list{max-height:560px;overflow:auto;}
.ph-list select{max-width:150px;font-size:12px;padding:3px 6px;}
.ph-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0;}

.ph-wide{grid-template-columns:minmax(300px,1.6fr) minmax(280px,1fr);}
@media(max-width:860px){.ph-wide{grid-template-columns:1fr;}}
.ph-sat{height:580px;width:100%;border-radius:12px;overflow:hidden;background:#0b1d2e;}
.ph-div{background:none;border:none;}
.ph-pin{position:absolute;left:-12px;top:-12px;display:flex;align-items:center;gap:3px;white-space:nowrap;pointer-events:auto;}
.ph-pin svg{flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75));}
.ph-pill{background:#fff;border:2px solid #1f3a63;border-radius:10px;font:700 11px/14px Inter,system-ui,sans-serif;color:#1c2a3d;padding:0 6px;}
.ph-dn{position:absolute;left:0;top:26px;transform:translateX(-50%);font:700 11px/14px Inter,system-ui,sans-serif;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000;}
.ph-lbl-sat{display:none;background:#fff;border:1px solid #9fb0c6;border-radius:4px;font:700 10.5px/14px Inter,system-ui,sans-serif;color:#1c2a3d;padding:0 5px;}
.ph-sat-z13 .ph-lbl-sat{display:inline-block;}
.ph-sat-name{position:absolute;transform:translate(-50%,-34px);font:700 11.5px/14px Inter,system-ui,sans-serif;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000;white-space:nowrap;}

/* ---------- Toast ---------- */
.toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:0 12px 30px -8px rgba(0,0,0,0.4);min-width:220px;animation:toastIn .18s ease-out;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.summary-mini-table{width:100%;border-collapse:collapse;font-size:13px;}
.summary-mini-table th{text-align:left;padding:8px 10px;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border);}
.summary-mini-table td{padding:8px 10px;border-bottom:1px solid #F0F1F5;}
.summary-mini-table tr:last-child td{border-bottom:none;}

.dest-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;
  max-height:440px;overflow-y:auto;padding:2px 4px 2px 2px;
}
.dest-card{

</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SPX Truck Lock GPS
   Single-file HTML/JS app. Data persisted via window.storage (shared=true)
   so it syncs across everyone who opens this artifact.
   ========================================================================= */

/* ---------------- Icons (inline SVG strings) ---------------- */
const ICONS = {
  seal: `<svg class="seal-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" stroke="#E28F35" stroke-width="2.6"/>
    <circle cx="20" cy="20" r="12.5" stroke="#E28F35" stroke-width="1.4" stroke-dasharray="2 3"/>
    <path d="M14 19V16.5C14 13.46 16.24 11 19.5 11C22.4 11 24.8 13.05 25.3 15.7" stroke="#E28F35" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="13.5" y="19" width="12" height="9.5" rx="2" fill="#E28F35"/>
  </svg>`,
  dash: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9zM14 20h6V4h-6v16zM4 20h6v-4H4v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/></svg>`,
  route: `<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M8 7c3 0 2 6 5 6h3" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/></svg>`,
  users: `<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 20c.7-3.6 3-5.5 5.5-5.5s4.8 1.9 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.5c1.6.3 2.8 1.7 2.8 3.4 0 1.7-1.2 3.1-2.8 3.4M17.5 14.7c2 .5 3.4 2.2 4 4.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  plate: `<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 11h2m2 0h2m2 0h1M7 14h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  repo: `<svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4" width="17" height="5" rx="1.2" stroke="currentColor" stroke-width="1.8"/><path d="M5 9v9a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0019 18V9M9.5 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  inbox: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 13l2.5-7h11L20 13v5a1 1 0 01-1 1H5a1 1 0 01-1-1v-5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 13h4l1 2h6l1-2h4M12 4v6m0 0l-2.5-2.5M12 10l2.5-2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ret: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 7L4 12l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h10a6 6 0 010 12" transform="translate(0 -5)" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  alloc: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4-8 4-8-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  empty: `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`
};

/* ---------------- State ---------------- */
let state = {
  users: [],
  locks: [],
  routes: [],
  allocations: [],
  currentUser: null,
  loading: true,
  activeTab: 'dashboard',
  filters: { status:'all', destination:'all', agency:'all', search:'' },
  masterFilters: { search:'' },
  allocFilters: { search:'', destination:'all' },
  assignForm: { dest:'', agency:'', lockId:'', plate:'' },
  returnForm: { lockId:'', choice:'', plate:'' },
  txlogs: [],
  plateSheet: {url:'', apiKey:''},
  plateData: null,
  plateLoading: false,
  plateDiag: null,
  plateError: '',
  plateFilters: {search:'', use:'all'},
  destGeo: {},
  mapMetric: 'all',
  mapView: {cx:260, cy:390, z:1},
  mapStyle: 'sat',
  mapSat: {lat:12.6, lng:122.2, z:6},
  repoFilters: { from:'', to:'', destination:'all', action:'all', search:'', group:'none' },
  receiveRemarks: {},
  receiveFilters: { search:'', destination:'all', type:'all' },
  selected: new Set(),
  modal: null,
  exportMenuOpen: null,
  toasts: [],
  loginError: '',
};

/* ---------------- Storage helpers ----------------
   Prefers window.storage (syncs across everyone using this file inside
   Claude's artifact panel). If that API isn't present — e.g. the file was
   downloaded and opened directly in a browser, or hosted elsewhere — it
   falls back to the browser's own localStorage so uploads still survive
   a refresh or logout/login. localStorage in that fallback case is only
   local to that one browser, not shared between different computers. */
const LS_PREFIX = 'sealtrack_';
const hasCloudStorage = () => (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasCloudStorage()){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; } // key not yet created
  }
  try{
    const v = localStorage.getItem(LS_PREFIX + key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storageSet(key, val){
  if(key==='st:locks' && Array.isArray(state.txlogs)) await storageSet('st:txlogs', state.txlogs);
  if(hasCloudStorage()){
    try{
      await window.storage.set(key, JSON.stringify(val), true);
      return true;
    }catch(e){
      // fall through and try a local backup so the edit isn't lost
    }
  }
  try{
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(val));
    return true;
  }catch(e){
    pushToast('Could not save changes — your browser storage may be full or blocked.', 'err');
    return false;
  }
}

function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function nowStamp(){
  const d = new Date();
  return d.toISOString();
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

/* ---------------- Init / defaults ---------------- */
async function initApp(){
  let users = await storageGet('st:users');
  if(!users || !Array.isArray(users) || users.length === 0){
    users = [{ id: genId('u'), username:'admin', password:'admin123', role:'admin', destination:null, createdAt: nowStamp() }];
    await storageSet('st:users', users);
  }
  let locks = await storageGet('st:locks');
  if(!locks) locks = [];
  let routes = await storageGet('st:routes');
  if(!routes) routes = [];

  state.users = users;
  state.locks = locks;
  let allocations = await storageGet('st:allocations');
  if(!allocations || !Array.isArray(allocations)) allocations = [];
  state.allocations = allocations;
  let txlogs = await storageGet('st:txlogs');
  if(!Array.isArray(txlogs)){
    // First run with the Repository: rebuild what history we can from the dates already stored on each lock.
    txlogs = [];
    const add = (l, ts, action, remarks)=>{ if(ts) txlogs.push({id:genId('tx'), ts, lockId:l.id, lockNo:l.lockNo, action, agency:l.agency||'', plate:l.plate||'', origin:l.origin||'', destination:l.destination||'', remarks:remarks||'', by:'(history)', role:''}); };
    locks.forEach(l=>{
      add(l, l.createdAt, 'added', '');
      add(l, l.assignedAt, 'assigned', '');
      add(l, l.receivedAt, 'received', l.receivedRemarks||'');
      add(l, l.returnStartedAt, 'return_started', '');
    });
    txlogs.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
    await storageSet('st:txlogs', txlogs);
  }
  state.txlogs = txlogs;
  let plateSheet = await storageGet('st:platesheet');
  state.plateSheet = (plateSheet && typeof plateSheet==='object' && !Array.isArray(plateSheet)) ? plateSheet : {url:DEFAULT_PLATE_SHEET, apiKey:''};
  startPlatePolling();
  let plateData = await storageGet('st:platedata');
  state.plateData = (plateData && Array.isArray(plateData.rows)) ? plateData : null;
  let destGeo = await storageGet('st:destgeo');
  state.destGeo = (destGeo && typeof destGeo==='object' && !Array.isArray(destGeo)) ? destGeo : {};
  state.routes = routes;
  state.loading = false;
  render();
}

/* ---------------- Toasts ---------------- */
function pushToast(msg, type){
  const id = genId('t');
  state.toasts.push({id, msg, type: type||'ok'});
  renderToastsOnly();
  setTimeout(()=>{
    state.toasts = state.toasts.filter(t=>t.id!==id);
    renderToastsOnly();
  }, 3200 + (msg.length>90 ? 3800 : 0));
}
function renderToastsOnly(){
  const el = document.getElementById('toastStack');
  if(!el) return;
  el.innerHTML = state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':(t.type==='ok'?'ok':'')}">${escapeHtml(t.msg)}</div>`).join('');
}

/* ---------------- Utils ---------------- */
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function distinctList(arr, key){
  const set = new Set();
  arr.forEach(x=>{ if(x[key] && String(x[key]).trim()) set.add(String(x[key]).trim()); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allDestinations(){
  const set = new Set();
  state.routes.forEach(r=>r.destination && set.add(r.destination));
  state.locks.forEach(l=>l.destination && set.add(l.destination));
  state.users.forEach(u=>u.destination && set.add(u.destination));
  state.allocations.forEach(a=>a.destination && set.add(a.destination));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
// Modules an account can be granted. Master Data and Users & Settings are admin-only.
const MODULES = [
  {id:'dashboard',  label:'Dashboard',            icon:ICONS.dash},
  {id:'locks',      label:'Truck Lock Assigning', icon:ICONS.lock},
  {id:'receive',    label:'Truck Lock to Receive', icon:ICONS.inbox, roles:['admin','destination','origin']},
  {id:'plates',     label:'Available Plates',     icon:ICONS.plate, roles:['admin','origin']},
  {id:'return',     label:'Return to Origin',     icon:ICONS.ret},
  {id:'allocation', label:'Allocation',           icon:ICONS.alloc},
  {id:'repository', label:'Repository',           icon:ICONS.repo},
  {id:'master',     label:'Master Data',          icon:ICONS.route, roles:['admin']},
  {id:'settings',   label:'Users & Settings',     icon:ICONS.users, roles:['admin']}
];
function modAllowed(m, role){ return !m.roles || m.roles.includes(role); }
function defaultModulesFor(role){
  return MODULES.filter(m=>modAllowed(m, role)).map(m=>m.id);
}
function userModules(u){
  if(!u) return [];
  const base = Array.isArray(u.modules) ? u.modules : defaultModulesFor(u.role);
  return MODULES.filter(m=>base.includes(m.id) && modAllowed(m, u.role)).map(m=>m.id);
}
function modLabel(id){ const m = MODULES.find(x=>x.id===id); return m ? m.label : id; }
function allOrigins(){
  const set = new Set();
  state.routes.forEach(r=>r.origin && set.add(r.origin));
  state.allocations.forEach(a=>a.origin && set.add(a.origin));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allAgencies(){
  const set = new Set();
  state.routes.forEach(r=>r.agency && set.add(r.agency));
  state.locks.forEach(l=>l.agency && set.add(l.agency));
  state.allocations.forEach(a=>a.agency && set.add(a.agency));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
// Truck Lock Assigning table: available stock stays out of view unless the Available filter is chosen.
function lockTableBase(){
  const all = visibleLocksBase();
  return state.filters.status==='available' ? all : all.filter(l=>l.status!=='available');
}
function sameStr(a,b){ const x=String(a==null?'':a).trim().toLowerCase(); return x!=='' && x===String(b==null?'':b).trim().toLowerCase(); }
function isOriginStaff(){ return !!state.currentUser && state.currentUser.role==='origin'; }
function isDestStaff(){ return !!state.currentUser && state.currentUser.role==='destination'; }
function scopeName(u){ return u ? (u.role==='origin' ? (u.origin||'') : (u.destination||'')) : ''; }
// Origin staff only handle locks that came from their origin.
function canArriveLock(l){
  if(!l || l.status!=='returning') return false;
  return state.currentUser.role==='admin' || (isOriginStaff() && sameStr(l.origin, state.currentUser.origin));
}
function visibleLocksBase(){
  // scope by role
  const u = state.currentUser;
  if(u && u.role === 'destination') return state.locks.filter(l => l.destination === u.destination);
  if(u && u.role === 'origin') return state.locks.filter(l => sameStr(l.origin, u.origin));
  return state.locks;
}
function applyFilters(list){
  const f = state.filters;
  return list.filter(l=>{
    if(f.status !== 'all' && l.status !== f.status) return false;
    if(f.destination !== 'all' && l.destination !== f.destination) return false;
    if(f.agency !== 'all' && l.agency !== f.agency) return false;
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = [l.lockNo,l.agency,l.plate,l.origin,l.destination].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

/* ---------------- Render root ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const app = document.getElementById('app');
  if(state.loading){
    app.innerHTML = `<div class="login-wrap"><div style="color:#fff;font-family:var(--font-display);font-size:15px;">Loading SPX Truck Lock GPS…</div></div>`;
    return;
  }
  if(!state.currentUser){
    app.innerHTML = renderLogin();
  } else {
    app.innerHTML = renderShell();
  }
  app.insertAdjacentHTML('beforeend', `<div class="toast-stack" id="toastStack">${state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':''}">${escapeHtml(t.msg)}</div>`).join('')}</div>`);

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  if(state.currentUser && typeof phAfterRender==='function') phAfterRender();
}

/* ---------------- Login screen ---------------- */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">${ICONS.seal}<span class="brand-name">SPX Truck Lock GPS</span></div>
      <p class="brand-sub">GPS Truck Lock tracking &amp; chain-of-custody</p>
      ${state.loginError ? `<div class="login-error">${escapeHtml(state.loginError)}</div>` : ''}
      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label for="loginUser">Username</label>
          <input id="loginUser" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">Password</label>
          <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block login-btn">Log in</button>
      </form>
      <div class="login-hint">First time here? Default admin login is <b>admin / admin123</b>. Sign in and change the password from Settings → your account.</div>
    </div>
  </div>`;
}

function handleLogin(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const match = state.users.find(x=>x.username.toLowerCase() === u.toLowerCase() && x.password === p);
  if(!match){
    state.loginError = 'Incorrect username or password.';
    render();
    return;
  }
  state.loginError = '';
  state.currentUser = match;
  state.activeTab = 'dashboard';
  state.filters = { status:'all', destination: match.role==='destination'? match.destination : 'all', agency:'all', search:'' };
  render();
  pushToast(`Welcome back, ${match.username}.`, 'ok');
}

function handleLogout(){
  state.currentUser = null;
  state.selected = new Set();
  render();
}

/* ---------------- Shell (post-login) ---------------- */
function renderShell(){
  const isAdmin = state.currentUser.role === 'admin';
  const allowedMods = userModules(state.currentUser);
  const tabs = MODULES.filter(m=>allowedMods.includes(m.id)).map(m=>({
    id:m.id, icon:m.icon,
    label: m.id==='locks' ? ((isAdmin || state.currentUser.role==='origin') ? 'Truck Lock Assigning' : 'My Truck Locks') : m.label
  }));
  if(!allowedMods.includes('settings')) tabs.push({id:'account', label:'My Account', icon:ICONS.users});

  return `
  <div class="shell">
    <div class="sidebar">
      <div class="sb-brand">${ICONS.seal}<span class="sb-brand-text">SPX Truck Lock GPS</span></div>
      ${tabs.map(t=>`
        <button class="nav-item ${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.icon}<span>${t.label}</span></button>
      `).join('')}
      <div class="sb-footer">
        <div class="sb-user">
          <b>${escapeHtml(state.currentUser.username)}</b>
          ${isAdmin ? '<span class="tag-pill tag-admin">Admin</span>' : `<span class="tag-pill tag-dest">${escapeHtml(scopeName(state.currentUser)||'—')}</span>`}
        </div>
        <button class="nav-item" onclick="handleLogout()">${ICONS.logout}<span>Log out</span></button>
      </div>
    </div>
    <div class="main">
      ${renderTab()}
    </div>
  </div>`;
}

function setTab(tab){
  const allowed = userModules(state.currentUser);
  if(tab!=='account' && !allowed.includes(tab)) return;
  state.activeTab = tab;
  if(tab==='plates') plateAutoRefresh();
  state.selected = new Set();
  state.exportMenuOpen = null;
  render();
}

function renderTab(){
  const allowed = userModules(state.currentUser);
  const t = state.activeTab;
  const ok = t==='account' ? !allowed.includes('settings') : allowed.includes(t);
  if(!ok){
    state.activeTab = allowed[0] || 'account';
    if(!allowed.length) return `<div class="panel">${emptyState('No modules assigned', 'Ask an admin to give your account access to a module.')}</div>`;
  }
  switch(state.activeTab){
    case 'dashboard': return renderDashboard();
    case 'locks': return renderLocksTab();
    case 'receive': return renderReceiveTab();
    case 'plates': return renderPlatesTab();
    case 'repository': return renderRepositoryTab();
    case 'return': return renderReturnTab();
    case 'allocation': return renderAllocationTab();
    case 'master': return renderMasterTab();
    case 'settings': return renderSettingsTab();
    case 'account': return renderAccountTab();
    default: return renderDashboard();
  }

    const box = document.getElementById('phSat'); if(box && box.scrollIntoView) box.scrollIntoView({block:'nearest', behavior:'smooth'});
    return;
  }
  const {x,y} = phProject(pl.lat, pl.lng);
  state.mapView = phClamp({cx:x, cy:y, z:Math.max(state.mapView.z, 8)});
  phApply();
  const el = document.getElementById('phSvg'); if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function setMapStyle(m){ state.mapStyle = m; render(); }
let phSatMap = null, phSatData = null, leafletPromise = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletPromise) return leafletPromise;
  leafletPromise = new Promise((resolve, reject)=>{
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';
    document.head.appendChild(css);
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';
    sc.onload = ()=>resolve();
    sc.onerror = ()=>{ leafletPromise = null; reject(new Error('leaflet failed to load')); };
    document.head.appendChild(sc);
  });
  return leafletPromise;
}
function phAfterRender(){
  const el = document.getElementById('phSat');
  if(!el) return;
  if(window.L){ phBuildSat(); return; }
  el.innerHTML = '<div class="helper-text" style="padding:22px;color:#cfd9e6;">Loading satellite imagery…</div>';
  loadLeaflet().then(()=>{ if(document.getElementById('phSat')) phBuildSat(); })
    .catch(()=>{ state.mapStyle = 'outline'; pushToast('Satellite view needs an internet connection. Showing the outline map instead.', 'err'); render(); });
}
function phPadIcon(color, size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="color:${color}">${PH_PADLOCK.replace(' id="phPadlock"','')}</svg>`;
}
function phBuildSat(){
  const el = document.getElementById('phSat');
  if(!el || !window.L || !phSatData) return;
  if(phSatMap){ try{ phSatMap.remove(); }catch(e){} phSatMap = null; }
  el.innerHTML = '';
  const v = state.mapSat;
  const map = L.map(el, {minZoom:5, maxZoom:18}).setView([v.lat, v.lng], v.z);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:18, attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:18, opacity:0.95}).addTo(map);
  const agg = L.layerGroup(), locks = L.layerGroup();
  const {placed, aggColor, maxV, topNames} = phSatData;
  const SPACING = 0.006; // degrees between locks of one destination (~650 m)
  const short = t => t.length>22 ? t.slice(0,21)+'…' : t;
  placed.forEach(r=>{
    const lat = r.place.lat, lng = r.place.lng;
    const size = Math.round(24 + 8*Math.sqrt(r.value/maxV));
    const tip = `${r.d} — ${r.place.label}: in-transit ${r.assigned}, received ${r.received}, returning ${r.returning}`;
    L.marker([lat, lng], {title: tip, icon: L.divIcon({className:'ph-div', iconSize:[0,0], html:
      `<div class="ph-pin">${phPadIcon(aggColor, size)}<span class="ph-pill" style="border-color:${aggColor}">${r.value}</span>${topNames.has(r.d) ? `<span class="ph-dn">${escapeHtml(short(r.d))}</span>` : ''}</div>`})}).addTo(agg);
    L.marker([lat, lng], {interactive:false, icon: L.divIcon({className:'ph-div', iconSize:[0,0], html:`<div class="ph-sat-name">${escapeHtml(short(r.d))}</div>`})}).addTo(locks);
    r.shown.forEach((l,i)=>{
      const ang = i*2.399963, rad = SPACING*Math.sqrt(i);
      const la = lat + rad*Math.sin(ang), ln = lng + rad*Math.cos(ang)/Math.cos(lat*Math.PI/180);
      const st = PH_STATUS[l.status], no = String(l.lockNo);
      const ltip = `${no} — ${r.d} · ${st.label}${l.plate?' · '+l.plate:''}${l.agency?' · '+l.agency:''}`;
      L.marker([la, ln], {title: ltip, icon: L.divIcon({className:'ph-div', iconSize:[0,0], html:
        `<div class="ph-pin">${phPadIcon(st.color, 24)}<span class="ph-lbl-sat">${escapeHtml(no)}</span></div>`})}).addTo(locks);
    });
  });
  const sync = ()=>{
    const z = map.getZoom();
    if(z >= 11){ if(map.hasLayer(agg)) map.removeLayer(agg); if(!map.hasLayer(locks)) map.addLayer(locks); }
    else { if(map.hasLayer(locks)) map.removeLayer(locks); if(!map.hasLayer(agg)) map.addLayer(agg); }
    el.classList.toggle('ph-sat-z13', z >= 13);
    const c = map.getCenter();
    state.mapSat = {lat:c.lat, lng:c.lng, z};
  };
  map.on('zoomend moveend', sync);
  sync();
  phSatMap = map;
}

const PH_STATUS = {assigned:{label:'In-transit', color:'var(--warning)'}, received:{label:'Received', color:'var(--success)'}, returning:{label:'Returning', color:'#8b5cf6'}};
const PH_PADLOCK = `<g id="phPadlock"><path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><rect x="5" y="11" width="14" height="10.5" rx="2.4" fill="currentColor" stroke="#fff" stroke-width="1.4"/><circle cx="12" cy="15.4" r="1.6" fill="#fff"/><rect x="11.4" y="15.6" width="1.2" height="3.2" fill="#fff"/></g>`;
function renderPhMap(scoped){
  const isAdmin = state.currentUser.role==='admin';
  const metric = state.mapMetric;
  const METRICS = {
    all:       {label:'All locks',  color:'var(--navy-3)'},
    assigned:  {label:'In-transit', color:PH_STATUS.assigned.color},
    received:  {label:'Received',   color:PH_STATUS.received.color},
    returning: {label:'Returning',  color:PH_STATUS.returning.color}
  };
  const by = new Map();
  scoped.forEach(l=>{
    if(!l.destination || !PH_STATUS[l.status]) return;
    if(!by.has(l.destination)) by.set(l.destination,{d:l.destination, assigned:0, received:0, returning:0, locks:[]});
    const g = by.get(l.destination); g[l.status]++; g.locks.push(l);
  });
  const rows = Array.from(by.values()).map(r=>{
    const place = phPlaceFor(r.d);
    const shown = r.locks.filter(l=>metric==='all' || l.status===metric).sort(lockSortNo);
    return {...r, place, shown, value: shown.length};
  }).sort((a,b)=>b.value-a.value || a.d.localeCompare(b.d));
  const placed = rows.filter(r=>r.place && r.value>0);
  const maxV = Math.max(1, ...placed.map(r=>r.value));
  const topNames = new Set(placed.slice(0,8).map(r=>r.d));
  const aggColor = METRICS[metric].color;
  phSatData = {placed, aggColor, maxV, topNames};
  const v = state.mapView;
  const tx = (x,y) => `style="transform:translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(var(--ph-s))"`;
  const D0 = 5.5; // spacing (map units) between locks of one destination
  const halo = 'paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;';
  const dests = placed.slice().sort((a,b)=>a.value-b.value).map(r=>{
    const c = phProject(r.place.lat, r.place.lng);
    const S = 1 + 0.6*Math.sqrt(r.value/maxV);
    const tip = `${r.d} — ${r.place.label}: in-transit ${r.assigned}, received ${r.received}, returning ${r.returning}`;
    const cnt = String(r.value), pillW = 8 + 6.4*cnt.length;
    const agg = `<g class="ph-agg" ${tx(c.x,c.y)}><title>${escapeHtml(tip)}</title>
        <g transform="scale(${S.toFixed(2)})" style="color:${aggColor}"><use href="#phPadlock" transform="translate(-9 -9) scale(0.75)"/></g>
        <rect x="${(10*S+2).toFixed(1)}" y="-8" width="${pillW}" height="16" rx="8" style="fill:#fff;stroke:${aggColor};stroke-width:1.5;"/>
        <text x="${(10*S+2+pillW/2).toFixed(1)}" y="4" text-anchor="middle" style="font-size:11px;font-weight:700;font-family:inherit;fill:#1c2a3d;">${cnt}</text>
        ${topNames.has(r.d) ? `<text x="0" y="${(14*S+8).toFixed(1)}" text-anchor="middle" style="font-size:11px;font-weight:700;font-family:inherit;fill:var(--text);${halo}">${escapeHtml(r.d.length>22 ? r.d.slice(0,21)+'…' : r.d)}</text>` : ''}
      </g>`;
    const locks = r.shown.map((l,i)=>{
      const ang = i*2.399963, rad = D0*Math.sqrt(i);
      const x = c.x + rad*Math.cos(ang), y = c.y + rad*Math.sin(ang);
      const st = PH_STATUS[l.status];
      const no = String(l.lockNo), w = 8 + 5.6*no.length;
      const ltip = `${no} — ${r.d} · ${st.label}${l.plate?' · '+l.plate:''}${l.agency?' · '+l.agency:''}`;
      return `<g ${tx(x,y)}><title>${escapeHtml(ltip)}</title>
        <g style="color:${st.color}"><use href="#phPadlock" transform="translate(-9 -9) scale(0.75)"/></g>
        <g class="ph-lbl"><rect x="10" y="-8" width="${w.toFixed(1)}" height="15" rx="3.5" style="fill:#fff;stroke:#9fb0c6;stroke-width:1;"/>
        <text x="${(10+w/2).toFixed(1)}" y="3.2" text-anchor="middle" style="font-size:9.5px;font-weight:700;font-family:inherit;fill:#1c2a3d;">${escapeHtml(no)}</text></g></g>`;
    }).join('');
    const nameTag = `<text ${tx(c.x,c.y)} x="0" y="-16" text-anchor="middle" style="font-size:11px;font-weight:700;font-family:inherit;fill:var(--text);${halo}">${escapeHtml(r.d.length>22 ? r.d.slice(0,21)+'…' : r.d)}</text>`;
    return `<g>${agg}<g class="ph-locks">${nameTag}${locks}</g></g>`;
  }).join('');
  const notOnMap = rows.filter(r=>!r.place).length;
  const placeOpts = PH_PLACES.map(p=>p.label).sort((a,b)=>a.localeCompare(b));
  const listRow = r => {
    const enc = encodeURIComponent(r.d);
    const manual = state.destGeo[r.d] || '';
    const auto = phAutoPlace(r.d);
    return `<tr>
      <td>${r.place ? `<button class="ph-lk" title="Zoom to this destination" onclick="phFocus(decodeURIComponent('${enc}'))">${escapeHtml(r.d)}</button>` : `<b>${escapeHtml(r.d)}</b> <span class="badge badge-noquota">Not on map</span>`}</td>
      <td>${r.assigned}</td><td>${r.received}</td><td>${r.returning}</td>
      ${isAdmin ? `<td><select onchange="setDestPlace(decodeURIComponent('${enc}'), this.value)" title="Where this destination sits on the map">
          <option value="">Auto${auto ? ' ('+escapeHtml(auto.label)+')' : ' (not found)'}</option>
          ${placeOpts.map(l=>`<option value="${escapeHtml(l)}" ${manual===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}
        </select></td>` : ''}
    </tr>`;
  };
  const legendIcon = c => `<svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;color:${c}"><use href="#phPadlock"/></svg>`;
  return `
    <div class="panel" style="margin-bottom:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div>
          <p class="panel-title">Locks per Destination — Philippines</p>
          <p class="panel-sub">Each padlock is a lock. Zoom in to see the lock number on every padlock, or click a destination in the list to jump to it.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="seg" role="group" aria-label="Map style">
            <button class="${state.mapStyle==='sat'?'is-on':''}" onclick="setMapStyle('sat')">Satellite</button>
            <button class="${state.mapStyle!=='sat'?'is-on':''}" onclick="setMapStyle('outline')">Outline</button>
          </div>
          <div class="seg" role="group" aria-label="Map filter">
            ${Object.keys(METRICS).map(k=>`<button class="${metric===k?'is-on':''}" onclick="setMapMetric('${k}')">${METRICS[k].label}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="usage-legend" style="margin:10px 0 0;">
        ${Object.keys(PH_STATUS).map(k=>`<span>${legendIcon(PH_STATUS[k].color)} ${PH_STATUS[k].label}</span>`).join('')}
      </div>
      ${rows.length===0 ? `<p class="helper-text">No locks are assigned to a destination yet.</p>` : `
      <div class="ph-wrap ${state.mapStyle==='sat'?'ph-wide':''}" style="margin-top:12px;">
        ${state.mapStyle==='sat' ? `<div class="ph-mapbox"><div id="phSat" class="ph-sat"></div></div>` : `<div class="ph-mapbox">
          <svg id="phSvg" class="${phClasses(v)}" viewBox="${phViewBox(v)}" style="--ph-s:${phScale(v)};" role="img" aria-label="Map of the Philippines with a padlock for each lock"
               onwheel="phWheel(event)" onpointerdown="phDown(event)" onpointermove="phMove(event)" onpointerup="phUp()" onpointercancel="phUp()">
            <defs>${PH_PADLOCK}</defs>
            <path d="${PH_MAP.d}" style="fill:var(--surface);stroke:var(--border);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke;"/>
            ${dests}
          </svg>
          <div class="ph-zoom"><button onclick="phZoomBtn(1.6)" title="Zoom in">+</button><button onclick="phZoomBtn(1/1.6)" title="Zoom out">−</button><button onclick="phReset()" title="Reset view" style="font-size:12px;">⟲</button></div>
          <div class="ph-hint">Scroll to zoom · drag to move</div>
        </div>`}
        <div>
          ${notOnMap ? `<p class="helper-text" style="margin:0 0 8px;color:var(--warning);">${notOnMap} destination(s) couldn't be placed from their name.${isAdmin ? ' Pick a location for them in the list.' : ''}</p>` : ''}
          <div class="ph-list table-wrap"><table>
            <thead><tr><th>Destination</th><th>In-transit</th><th>Received</th><th>Returning</th>${isAdmin?'<th>Map location</th>':''}</tr></thead>
            <tbody>${rows.map(listRow).join('')}</tbody>
          </table></div>
        </div>
      </div>`}
    </div>`;
}

// Origin accounts: un-assigned (still usable) locks per destination per agency, from their own origin's allocations.
function renderOriginUnassigned(){
  const u = state.currentUser;
  const rows = state.allocations.filter(a=>sameStr(a.origin, u.origin))
    .map(a=>{ const used = allocUsedCount(a.destination, a.agency); return {d:a.destination, ag:a.agency, qty:a.qty, used, left:Math.max(a.qty-used,0)}; })
    .sort((x,y)=>x.d.localeCompare(y.d) || x.ag.localeCompare(y.ag));
  const tot = rows.reduce((t,r)=>({qty:t.qty+r.qty, used:t.used+r.used, left:t.left+r.left}), {qty:0, used:0, left:0});
  return `
    <div class="panel" style="margin-bottom:20px;">
      <p class="panel-title">Un-assigned Locks per Destination &amp; Agency</p>
      <p class="panel-sub">Locks from ${escapeHtml(u.origin||'your origin')} that are allocated but not assigned yet, so they can still be used.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Destination</th><th>Agency</th><th>Allocated</th><th>Assigned</th><th>Un-assigned</th></tr></thead>
        <tbody>
          ${rows.length===0 ? `<tr class="empty-row"><td colspan="5">${emptyState('No allocations', 'Allocations from your origin will be counted here.')}</td></tr>` : rows.map(r=>`
            <tr>
              <td><b>${escapeHtml(r.d)}</b></td>
              <td>${escapeHtml(r.ag)}</td>
              <td><span class="qty-num">${r.qty}</span></td>
              <td><span class="qty-num">${r.used}</span></td>
              <td><span class="qty-num ${r.left===0?'bal-low':'bal-ok'}">${r.left}</span></td>
            </tr>`).join('') + `
            <tr style="background:var(--surface-2);font-weight:700;">
              <td colspan="2">Total</td>
              <td><span class="qty-num">${tot.qty}</span></td>
              <td><span class="qty-num">${tot.used}</span></td>
              <td><span class="qty-num">${tot.left}</span></td>
            </tr>`}
        </tbody>
      </table></div>
    </div>`;
}

function renderDashboard(){
  const isAdmin = state.currentUser.role === 'admin';
  const scoped = visibleLocksBase();
  const unused = isOriginStaff()
    ? state.locks.filter(l=>{ if(l.status!=='available') return false; const r = reservationOf(l.id); return !r || sameStr(r.origin, state.currentUser.origin); }).length
    : scoped.filter(l=>l.status==='available').length;
  const assigned = scoped.filter(l=>l.status==='assigned').length;
  const received = scoped.filter(l=>l.status==='received').length;
  const returning = scoped.filter(l=>l.status==='returning').length;
  const destView = isDestStaff();
  // Admin: Total Locks = un-used + assigned, Available = un-used + received.
  // Destination: Total Trucks = received + returning to origin, Available = received only.
  const total = destView ? received + returning : unused + assigned;
  const available = destView ? received : unused + received;
  const totalLabel = destView ? 'Total Trucks' : 'Total Locks';
  const totalNote = destView ? 'received + return to origin' : 'un-used + assigned';
  const availNote = destView ? 'received (excl. return to origin)' : 'un-used + received';

  // One card per destination for a given status, with an agency breakdown.
  const cardsFor = (status, cls) => {
    const map = new Map();
    scoped.filter(l=>l.status===status && l.destination).forEach(l=>{
      if(!map.has(l.destination)) map.set(l.destination, {d:l.destination, n:0, agencies:new Map()});
      const g = map.get(l.destination);
      g.n++;
      const ag = l.agency || '—';
      g.agencies.set(ag, (g.agencies.get(ag)||0) + 1);
    });
    return Array.from(map.values()).sort((x,y)=>y.n-x.n || x.d.localeCompare(y.d)).map(g=>`
      <div class="stat-card ${cls}">
        <div class="stat-label">${escapeHtml(g.d)}</div>
        <div class="stat-value">${g.n}</div>
        <div class="stat-breakdown">
          ${Array.from(g.agencies.entries()).sort((x,y)=>y[1]-x[1] || x[0].localeCompare(y[0])).map(([ag,n])=>`<span><em>${escapeHtml(ag)}</em><b>${n}</b></span>`).join('')}
        </div>
      </div>`);
  };
  // Assigned Destination: in-transit locks plus allocated locks not assigned yet (still usable).
  const aMap = new Map();
  const aGet = (d)=>{ if(!aMap.has(d)) aMap.set(d,{d, n:0, left:0, ag:new Map()}); return aMap.get(d); };
  const agGet = (g,name)=>{ if(!g.ag.has(name)) g.ag.set(name,{n:0,left:0}); return g.ag.get(name); };
  scoped.filter(l=>l.status==='assigned' && l.destination).forEach(l=>{
    const g = aGet(l.destination); g.n++; agGet(g, l.agency||'—').n++;
  });
  state.allocations.filter(a=>isAdmin || (isOriginStaff() ? sameStr(a.origin,state.currentUser.origin) : a.destination===state.currentUser.destination)).forEach(a=>{
    const left = Math.max(a.qty - allocUsedCount(a.destination, a.agency), 0);
    const g = aGet(a.destination); g.left += left; agGet(g, a.agency).left += left;
  });
  const assignedCards = Array.from(aMap.values()).filter(g=>g.n>0 || g.left>0)
    .sort((x,y)=>y.n-x.n || y.left-x.left || x.d.localeCompare(y.d)).map(g=>`
      <div class="stat-card c-assigned">
        <div class="stat-label">${escapeHtml(g.d)}</div>
        <div class="stat-value">${g.n}</div>
        <div class="stat-sub">in-transit</div>
        <div class="stat-extra"><span>Not assigned (still usable)</span><b>${g.left}</b></div>
      </div>`);
  const receivedCards = cardsFor('received','c-received');
  // Returning to Origin: one card per destination the locks are coming back from, with a breakdown by origin.
  const rMap = new Map();
  scoped.filter(l=>l.status==='returning' && l.destination).forEach(l=>{
    if(!rMap.has(l.destination)) rMap.set(l.destination,{d:l.destination,n:0,o:new Map()});
    const g = rMap.get(l.destination); g.n++;
    const o = l.origin || '—'; g.o.set(o,(g.o.get(o)||0)+1);
  });
  const returningCards = Array.from(rMap.values()).sort((x,y)=>y.n-x.n || x.d.localeCompare(y.d)).map(g=>`
      <div class="stat-card c-returning">
        <div class="stat-label">${escapeHtml(g.d)}</div>
        <div class="stat-value">${g.n}</div>
        <div class="stat-sub">returning to origin</div>
        <div class="stat-breakdown">
          ${Array.from(g.o.entries()).sort((x,y)=>y[1]-x[1] || x[0].localeCompare(y[0])).map(([o,n])=>`<span><em>→ ${escapeHtml(o)}</em><b>${n}</b></span>`).join('')}
        </div>
      </div>`);

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">${isAdmin? 'Fleet-wide overview of every truck lock.' : `Overview for ${escapeHtml(scopeName(state.currentUser))}${isOriginStaff()?' (origin)':''}.`}</p>
      </div>
    </div>
    <div class="grid-cards">
      <div class="stat-card c-total"><div class="stat-label">${totalLabel}</div><div class="stat-value">${total}</div><div class="stat-sub">${totalNote}</div></div>
      <div class="stat-card c-available"><div class="stat-label">${destView ? 'Total Available' : 'Available'}</div><div class="stat-value">${available}</div><div class="stat-sub">${availNote}</div></div>
      <div class="stat-card c-assigned"><div class="stat-label">Assigned / In-transit</div><div class="stat-value">${assigned}</div></div>
      <div class="stat-card c-received"><div class="stat-label">Received / Complete</div><div class="stat-value">${received}</div></div>
      <div class="stat-card c-returning"><div class="stat-label">Returning to Origin</div><div class="stat-value">${returning}</div></div>
    </div>
    ${renderPhMap(scoped)}
    ${isOriginStaff() ? renderOriginUnassigned() : ''}
    <div class="panel" style="margin-bottom:20px;">
      <p class="panel-title">Assigned Destination</p>
      <p class="panel-sub">Truck locks in-transit to each destination, plus the allocated locks not yet assigned (still usable). Once a destination receives a lock, it moves to Received Destination below.</p>
      ${assignedCards.length ? `<div class="dest-stat-grid">${assignedCards.join('')}</div>` : `<p class="helper-text">No locks in-transit right now.</p>`}
    </div>
    <div class="panel">
      <p class="panel-title">Received Destination</p>
      <p class="panel-sub">All locks received by each destination.</p>
      ${receivedCards.length ? `<div class="dest-stat-grid">${receivedCards.join('')}</div>` : `<p class="helper-text">No locks received yet.</p>`}
    </div>

/* ---------------- Lock actions ---------------- */
async function markReceived(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(state.currentUser.role!=='admin'){ pushToast("Only an admin can mark received here. Use Truck Lock to Receive.", 'err'); return; }
  lock.status = 'received';
  lock.receivedAt = nowStamp();
  logTx(lock, 'received', '');
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} marked as received.`, 'ok');
  render();
}
async function bulkMarkReceived(){
  if(state.currentUser.role!=='admin'){ pushToast("Only an admin can mark received here.", 'err'); return; }
  let n=0;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id) && l.status==='assigned'){
      l.status='received'; l.receivedAt = nowStamp(); logTx(l, 'received', ''); n++;
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${n} lock(s) marked as received.`, 'ok');
  render();
}
function canReturnLock(l){
  if(!l || l.status!=='received') return false;
  return state.currentUser.role==='admin' || (isDestStaff() && l.destination===state.currentUser.destination);
}
async function returnToOrigin(id){
  const l = state.locks.find(x=>x.id===id);
  if(!canReturnLock(l)){ pushToast("This lock can't be returned to origin.", 'err'); return; }
  if(!confirm(`Send lock ${l.lockNo} back to its origin (${l.origin||'—'})?`)) return;
  Object.assign(l, {status:'returning', returnStartedAt: nowStamp()});
  logTx(l, 'return_started', '');
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${l.lockNo} is returning to ${l.origin||'its origin'}.`, 'ok');
  render();
}
async function bulkReturnToOrigin(){
  const sel = state.locks.filter(l=>state.selected.has(l.id));
  if(!sel.length || !sel.every(canReturnLock)){ pushToast("Some selected locks can't be returned to origin.", 'err'); return; }
  if(!confirm(`Send ${sel.length} lock(s) back to their origin?`)) return;
  const stamp = nowStamp();
  sel.forEach(l=>{ Object.assign(l,{status:'returning', returnStartedAt:stamp}); logTx(l, 'return_started', ''); });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${sel.length} lock(s) returning to origin.`, 'ok');
  render();
}
function backToStock(l, remarks){
  // Back at origin: lock is available stock again. A reservation to an allocation stays in place.
  logTx(l, 'back_at_origin', remarks);
  Object.assign(l, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null, receivedRemarks:'', returnStartedAt:null,
    returnedAt: nowStamp(), returnRemarks: String(remarks||'').trim(), returnedBy: state.currentUser.username});
}
async function arriveAtOrigin(id){
  const l = state.locks.find(x=>x.id===id);
  if(!canArriveLock(l)){ pushToast("You can't confirm this lock back at origin.", 'err'); return; }
  backToStock(l);
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${l.lockNo} is back at origin and available.`, 'ok');
  render();
}
async function bulkArriveAtOrigin(){
  const sel = state.locks.filter(l=>state.selected.has(l.id) && canArriveLock(l));
  if(!sel.length) return;
  sel.forEach(l=>backToStock(l));
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${sel.length} lock(s) are back at origin and available.`, 'ok');

}
async function unassignLock(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(!confirm(`Release lock ${lock.lockNo} to Available? This clears its assignment.`)) return;
  logTx(lock, 'released', '');
  Object.assign(lock, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null, receivedRemarks:''});
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} released to available.`, 'ok');
  render();
}
async function bulkUnassign(){
  if(!confirm(`Release ${state.selected.size} lock(s) to Available?`)) return;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id)){
      if(l.status!=='available') logTx(l, 'released', '');
      Object.assign(l, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null, receivedRemarks:''});
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast('Selected locks released to available.', 'ok');
  render();
}
async function deleteLock(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(!confirm(`Delete lock ${lock.lockNo} permanently?`)) return;
  logTx(lock, 'deleted', '');
  state.locks = state.locks.filter(l=>l.id!==id);
  await storageSet('st:locks', state.locks);
  pushToast('Lock deleted.', 'ok');
  render();
}
async function bulkDeleteLocks(){
  if(!confirm(`Delete ${state.selected.size} lock(s) permanently?`)) return;
  state.locks.filter(l=>state.selected.has(l.id)).forEach(l=>logTx(l, 'deleted', ''));
  state.locks = state.locks.filter(l=>!state.selected.has(l.id));
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast('Selected locks deleted.', 'ok');
  render();
}

async function submitBulkLocks(){
  const fileInput = document.getElementById('bulkLockFile');
  const text = document.getElementById('bulkLockText').value;
  let numbers = [];

  if(fileInput && fileInput.files && fileInput.files[0]){
    try{
      numbers = await extractLockNumbersFromFile(fileInput.files[0]);
    }catch(e){
      pushToast('Could not read that file. Please check the format.', 'err');
      return;
    }
  }
  if(text.trim()){
    text.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>numbers.push(n));
  }
  numbers = Array.from(new Set(numbers.map(n=>n.trim()).filter(Boolean)));

  if(numbers.length===0){
    pushToast('No lock numbers found to upload.', 'err');
    return;
  }
  const existing = new Set(state.locks.map(l=>l.lockNo.toLowerCase()));
  let added=0, skipped=0;
  numbers.forEach(n=>{
    if(existing.has(n.toLowerCase())){ skipped++; return; }
    const nl = {
      id: genId('lk'), lockNo: n, status:'available',
      agency:'', plate:'', origin:'', destination:'',
      assignedAt:null, receivedAt:null, createdAt: nowStamp()
    };
    state.locks.push(nl);
    logTx(nl, 'added', '');
    existing.add(n.toLowerCase());
    added++;
  });
  await storageSet('st:locks', state.locks);
  closeModal();
  pushToast(`${added} lock(s) added.${skipped? ' '+skipped+' duplicate(s) skipped.':''}`, 'ok');
}

function extractLockNumbersFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(rows.length===0){ resolve([]); return; }
        const headerKeys = Object.keys(rows[0]);
        const candidates = ['lock no','lock number','gps lock no','gps lock number','gps truck lock','serial no','serial number','lock','id'];
        let col = headerKeys.find(h => candidates.includes(String(h).trim().toLowerCase()));
        if(!col) col = headerKeys[0];
        const vals = rows.map(r=>String(r[col]||'').trim()).filter(Boolean);
        resolve(vals);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function txDay(ts){ const d = new Date(ts); const p = n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function repoScoped(){
  const u = state.currentUser;
  if(u.role==='destination') return state.txlogs.filter(e=>e.destination===u.destination);
  if(u.role==='origin') return state.txlogs.filter(e=>sameStr(e.origin, u.origin));
  return state.txlogs;
}
function repoFiltered(){
  const f = state.repoFilters;
  const q = f.search.trim().toLowerCase();
  return repoScoped().filter(e=>{
    if(f.from && txDay(e.ts) < f.from) return false;
    if(f.to && txDay(e.ts) > f.to) return false;
    if(f.destination!=='all' && e.destination!==f.destination) return false;
    if(f.action!=='all' && e.action!==f.action) return false;
    if(q && ![e.lockNo,e.agency,e.plate,e.origin,e.destination,e.remarks,e.by].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
}

// Two kinds of receiving: assigned locks arriving at a destination, and returning locks arriving back at their origin.
function canReceiveLock(l){
  if(!l || l.status!=='assigned') return false;
  return state.currentUser.role==='admin' || (isDestStaff() && l.destination===state.currentUser.destination);
}
function canReceiveItem(l){ return l && l.status==='returning' ? canArriveLock(l) : canReceiveLock(l); }

  const f = state.receiveFilters;

    : (role==='destination' ? l.status==='assigned' : (l.status==='assigned' || l.status==='returning'));

async function receiveLock(id){
  const l = state.locks.find(x=>x.id===id);
  if(!canReceiveItem(l)){ pushToast("You can't receive this lock.", 'err'); return; }
  const remarks = String(state.receiveRemarks[id]||'').trim();
  delete state.receiveRemarks[id];
  if(l.status==='returning'){
    const o = l.origin, no = l.lockNo;
    backToStock(l, remarks);
    await storageSet('st:locks', state.locks);
    pushToast(`Lock ${no} received back at ${o||'origin'} and is available again.`, 'ok');
  } else {
    Object.assign(l, {status:'received', receivedAt: nowStamp(), receivedRemarks: remarks, receivedBy: state.currentUser.username});
    logTx(l, 'received', remarks);
    await storageSet('st:locks', state.locks);
    pushToast(`Lock ${l.lockNo} received at ${l.destination}.`, 'ok');
  }
  render();
}

const PLATE_POLL_MS = 60*1000;
const DEFAULT_PLATE_SHEET = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR3LfsNBiXClAGk0KxIAs1cfj7gRwjK6zeofjTvjumSWH9_jcfgmY0BwkIb2llPi_a3yZ3E3YVMXSl3/pub?gid=1481905008&single=true&output=csv';
let plateTimer = null, plateChecked = null;
function parseSheetUrl(u){
  const url = String(u||'').trim();
  const m = url.match(/\/spreadsheets\/d\/(e\/)?([a-zA-Z0-9_-]+)/);
  const g = url.match(/[?#&]gid=(\d+)/);
  return {id: m ? m[2] : '', published: !!(m && m[1]), gid: g ? g[1] : ''};
}
// Read through the Google Sheets API (steady, needs an API key and a sheet that anyone with the link can view).
async function fetchSheetApi(id, gid, key){
  const base = `https://sheets.googleapis.com/v4/spreadsheets/${id}`;
  const j = async (u)=>{
    const res = await fetch(u);
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error((data.error && data.error.message) || ('Google returned '+res.status));
    return data;
  };
  const meta = await j(`${base}?fields=sheets.properties(sheetId,title)&key=${encodeURIComponent(key)}`);
  const sheets = (meta.sheets||[]).map(x=>x.properties);
  const tab = (gid && sheets.find(x=>String(x.sheetId)===String(gid))) || sheets[0];
  if(!tab) throw new Error('No tabs found in that spreadsheet.');
  const vals = await j(`${base}/values/${encodeURIComponent(tab.title)}?majorDimension=ROWS&key=${encodeURIComponent(key)}`);
  return vals.values || [];
}
// Read the sheet as CSV (works for "anyone with the link" or "published to the web" sheets).
// Plain GET requests only: extra request headers would trigger a CORS preflight that Google does not answer.
function plateErrText(e){
  const m = (e && e.message) ? e.message : String(e);
  return /failed to fetch|networkerror|load failed/i.test(m)
    ? 'the browser blocked the request to Google (Failed to fetch)' : m;
}
async function fetchSheetCsvMatrix(id, gid, published, originalUrl){
  const g = gid ? '&gid='+gid : '';
  const bust = '&_=' + Date.now();
  const tries = [];
  if(published){
    if(/output=csv/i.test(originalUrl||'')) tries.push(originalUrl + (originalUrl.includes('?') ? '&' : '?') + '_=' + Date.now());
    tries.push(`https://docs.google.com/spreadsheets/d/e/${id}/pub?output=csv${g}${bust}`);
  } else {
    tries.push(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${g}${bust}`);
    tries.push(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv${g}${bust}`);
  }
  const problems = [];
  for(const u of tries){
    try{
      const res = await fetch(u);
      if(!res.ok){ problems.push('Google returned '+res.status); continue; }
      const text = await res.text();
      if(/^\s*<(!doctype|html)/i.test(text)){ problems.push('the sheet is not published / not shared with "Anyone with the link"'); continue; }
      const wb = XLSX.read(text, {type:'string'});
      return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:'', raw:false});
    }catch(e){ problems.push(plateErrText(e)); }
  }
  throw new Error('Could not read the sheet: ' + Array.from(new Set(problems)).join('; ') + '.');
}
const PLATE_SCRIPT_CODE = [
  "// Paste in the Google Sheet: Extensions > Apps Script. Then Deploy > New deployment > Web app.",
  "// Execute as: Me   |   Who has access: Anyone",
  "const SHEET_NAME = '';   // leave empty for the first tab, or type the tab name, e.g. 'Plates'",
  "const TOKEN = '';        // optional secret: if set, add ?key=YOUR_SECRET to the web app link",
  "",
  "function doGet(e) {",
  "  try {",
  "    if (TOKEN && (!e || !e.parameter || e.parameter.key !== TOKEN)) return out_({ok: false, error: 'Not authorised'});",
  "    const ss = SpreadsheetApp.getActiveSpreadsheet();",
  "    const sh = SHEET_NAME ? ss.getSheetByName(SHEET_NAME) : ss.getSheets()[0];",
  "    if (!sh) return out_({ok: false, error: 'Tab not found: ' + SHEET_NAME});",
  "    return out_({ok: true, updated: new Date().toISOString(), values: sh.getDataRange().getDisplayValues()});",
  "  } catch (err) {",
  "    return out_({ok: false, error: String(err)});",
  "  }",
  "}",
  "",
  "function out_(obj) {",
  "  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);",
  "}"
].join('\n');
function plateConfigured(){ return !!(((state.plateSheet.script||'').trim()) || ((state.plateSheet.url||'').trim())); }
async function copyPlateScript(){
