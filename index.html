<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SealTrack — GPS Truck Lock Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F4F5F8;
  --surface:#FFFFFF;
  --surface-2:#EEF1F6;
  --navy:#131F38;
  --navy-2:#1D2D4D;
  --navy-3:#28406B;
  --accent:#E28F35;
  --accent-dark:#C97620;
  --accent-bg:#FCEBD6;
  --success:#1F8B4C;
  --success-bg:#E2F5EA;
  --warning:#B4740E;
  --warning-bg:#FBEED4;
  --slate:#5B6478;
  --slate-bg:#E8EBF0;
  --danger:#C0392B;
  --danger-bg:#FBEAE8;
  --maintenance:#7C3AED;
  --maintenance-bg:#EFE7FD;
  --border:#DDE2EA;
  --text:#131A2A;
  --text-dim:#5B6478;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-bg);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(226,143,53,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(40,64,107,0.12), transparent 45%),
    var(--navy);
  padding:24px;
}
.login-card{
  background:var(--surface);
  width:100%;
  max-width:420px;
  border-radius:14px;
  padding:38px 36px 32px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,0.5);
  position:relative;
  overflow:hidden;
}
.login-card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 48%,var(--accent) 48%,var(--accent) 100%);
}
.brand-mark{
  display:flex;align-items:center;gap:10px;margin-bottom:6px;
}
.seal-icon{width:36px;height:36px;flex-shrink:0;}
.brand-name{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:-0.02em;
  color:var(--navy);
}
.brand-sub{
  font-size:12.5px;
  color:var(--text-dim);
  margin:0 0 28px;
  padding-left:46px;
  letter-spacing:0.02em;
}
.field{margin-bottom:16px;}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;
}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14.5px;color:var(--text);background:var(--surface);transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none;border-color:var(--navy-3);
}
.btn{
  border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s, box-shadow .15s, background .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--surface-2);color:var(--text);}
.btn-ghost:hover{background:#E1E5EC;}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:#F6D5D1;}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-success:hover{background:#CFEEDC;}
.btn-maintenance{background:var(--maintenance-bg);color:var(--maintenance);}
.btn-maintenance:hover{background:#E1D3FB;}
.btn-block{width:100%;}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
.btn:disabled{opacity:0.42;cursor:not-allowed;}
.login-btn{margin-top:6px;}
.login-hint{
  margin-top:20px;padding:12px 14px;background:var(--surface-2);border-radius:8px;
  font-size:12.5px;color:var(--text-dim);line-height:1.5;
}
.login-hint b{color:var(--text);font-family:var(--font-mono);}
.login-error{
  background:var(--danger-bg);color:var(--danger);font-size:13px;padding:10px 12px;
  border-radius:8px;margin-bottom:16px;font-weight:500;
}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh;
}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:18px;}
.sb-brand .seal-icon{width:28px;height:28px;}
.sb-brand-text{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-0.02em;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:rgba(255,255,255,0.72);font-size:14px;font-weight:500;margin-bottom:3px;
  background:none;border:none;width:100%;text-align:left;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;}
.nav-item svg{flex-shrink:0;width:17px;height:17px;}
.sb-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);}
.sync-badge{
  font-size:11px;font-weight:600;padding:7px 9px;border-radius:7px;margin-bottom:10px;
  line-height:1.4;cursor:default;
}
.sync-ok{background:rgba(47,158,91,0.16);color:#8FE4B4;}
.sync-warn{background:rgba(196,116,14,0.22);color:#F5C27A;}
.sync-ok-light{background:var(--success-bg);color:var(--success);margin-top:12px;margin-bottom:0;}
.sync-warn-light{background:var(--warning-bg);color:var(--warning);margin-top:12px;margin-bottom:0;}
.sb-user{padding:8px 10px;font-size:12.5px;color:rgba(255,255,255,0.65);margin-bottom:8px;}
.sb-user b{color:#fff;display:block;font-size:13.5px;margin-bottom:1px;}
.tag-pill{
  display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.05em;padding:2px 7px;border-radius:20px;margin-top:4px;
}
.tag-admin{background:var(--accent);color:#fff;}
.tag-dest{background:rgba(255,255,255,0.14);color:#fff;}

.main{flex:1;min-width:0;padding:26px 32px 60px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-0.01em;margin:0;}
.page-sub{color:var(--text-dim);font-size:13.5px;margin:3px 0 0;}

/* ---------- Cards / summary ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 18px 16px;
  position:relative;overflow:hidden;cursor:pointer;user-select:none;
  transition:transform .1s ease, box-shadow .15s ease, border-color .15s ease;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(19,31,56,0.25);}
.stat-card:active{transform:translateY(0);}
.stat-card:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px;}
.stat-card.is-active{border-color:var(--navy-3);box-shadow:0 0 0 2px rgba(29,45,77,0.14);}
.stat-card::after{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;}
.stat-card.c-total::after{background:var(--navy-3);}
.stat-card.c-available::after{background:var(--slate);}
.stat-card.c-assigned::after{background:var(--warning);}
.stat-card.c-received::after{background:var(--success);}
.stat-card.c-maintenance::after{background:var(--maintenance);}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);font-weight:600;}
.stat-value{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:6px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px;}
.panel-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;margin:0 0 4px;}
.panel-sub{font-size:12.5px;color:var(--text-dim);margin:0 0 14px;}

/* ---------- Table ---------- */
.table-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
.table-toolbar .grow{flex:1;min-width:160px;}
.search-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;}
.search-input:focus{outline:none;border-color:var(--navy-3);}
.filter-select{padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px;}
thead th{
  background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11px;
  text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid #EEF0F4;vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
.mono{font-family:var(--font-mono);font-weight:600;letter-spacing:0.01em;}
.empty-row td{text-align:center;padding:36px 12px;color:var(--text-dim);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;
}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-available{background:var(--slate-bg);color:var(--slate);}
.badge-assigned{background:var(--warning-bg);color:var(--warning);}
.badge-received{background:var(--success-bg);color:var(--success);}
.badge-outgoing{background:var(--accent-bg);color:var(--accent-dark);}
.badge-maintenance{background:var(--maintenance-bg);color:var(--maintenance);}

.action-row{display:flex;gap:6px;flex-wrap:wrap;}
.row-check{width:16px;height:16px;accent-color:var(--navy);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,20,35,0.55);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);
}
.modal{
  background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;
  overflow-y:auto;box-shadow:0 30px 70px -15px rgba(0,0,0,0.4);
}
.modal-header{padding:20px 24px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.modal-title{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0;}
.modal-sub{font-size:12.5px;color:var(--text-dim);margin:4px 0 0;}
.modal-close{background:none;border:none;font-size:20px;color:var(--text-dim);line-height:1;padding:4px;}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--border);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:110px;overflow-y:auto;padding:2px;}
.chip{background:var(--surface-2);border-radius:20px;padding:4px 10px;font-size:12px;font-family:var(--font-mono);font-weight:600;}
.upload-drop{
  border:1.5px dashed var(--border);border-radius:10px;padding:22px;text-align:center;background:var(--surface-2);
}
.upload-drop input[type=file]{display:block;margin:10px auto 0;font-size:12.5px;}
.divider-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--text-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;}
.divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--border);}
.helper-text{font-size:11.5px;color:var(--text-dim);margin-top:5px;line-height:1.5;}
.template-link{font-size:12px;color:var(--navy-3);font-weight:600;text-decoration:underline;background:none;border:none;padding:0;}

/* ---------- Toast ---------- */
.toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--navy);color:#fff;padding:12px 16px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:0 12px 30px -8px rgba(0,0,0,0.4);min-width:220px;animation:toastIn .18s ease-out;
}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.summary-mini-table{width:100%;border-collapse:collapse;font-size:13px;}
.summary-mini-table th{text-align:left;padding:8px 10px;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border);}
.summary-mini-table td{padding:8px 10px;border-bottom:1px solid #F0F1F5;}
.summary-mini-table tr:last-child td{border-bottom:none;}

.dest-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;
  max-height:440px;overflow-y:auto;padding:2px 4px 2px 2px;
}
.dest-card{
  background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:13px 14px 12px;
  cursor:pointer;user-select:none;transition:transform .1s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.dest-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(19,31,56,0.25);}
.dest-card:focus-visible{outline:2px solid var(--navy-3);outline-offset:2px;}
.dest-card.is-active{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 2px rgba(226,143,53,0.16);}
.dest-card-name{
  font-size:11.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dest-card-value{font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:5px;color:var(--success);}
.dest-card.is-active .dest-card-value{color:var(--accent-dark);}
.dest-card-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.dest-card-sub2{font-size:11px;color:var(--warning);margin-top:1px;font-weight:600;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
@media(max-width:960px){.two-col{grid-template-columns:1fr;}}

.export-menu-wrap{position:relative;display:inline-block;}
.export-menu{
  position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;box-shadow:0 14px 32px -10px rgba(0,0,0,0.25);min-width:170px;overflow:hidden;z-index:20;
}
.export-menu button{
  display:block;width:100%;text-align:left;padding:10px 14px;background:none;border:none;font-size:13px;font-weight:500;
}
.export-menu button:hover{background:var(--surface-2);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state svg{width:46px;height:46px;margin-bottom:10px;opacity:0.5;}
.empty-state h4{margin:0 0 4px;color:var(--text);font-family:var(--font-display);}
.empty-state p{margin:0;font-size:13px;}

@media(max-width:760px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:12px;}
  .sb-brand{display:none;}
  .sb-footer{display:none;}
  .main{padding:18px;}
  .form-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   SealTrack — GPS Truck Lock Tracker
   Single-file HTML/JS app. Data persisted via window.storage (shared=true)
   so it syncs across everyone who opens this artifact.
   ========================================================================= */

/* ---------------- Icons (inline SVG strings) ---------------- */
const ICONS = {
  seal: `<svg class="seal-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="18" stroke="#E28F35" stroke-width="2.6"/>
    <circle cx="20" cy="20" r="12.5" stroke="#E28F35" stroke-width="1.4" stroke-dasharray="2 3"/>
    <path d="M14 19V16.5C14 13.46 16.24 11 19.5 11C22.4 11 24.8 13.05 25.3 15.7" stroke="#E28F35" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="13.5" y="19" width="12" height="9.5" rx="2" fill="#E28F35"/>
  </svg>`,
  dash: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9zM14 20h6V4h-6v16zM4 20h6v-4H4v4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8"/></svg>`,
  route: `<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="18" r="2.4" stroke="currentColor" stroke-width="1.8"/><path d="M8 7c3 0 2 6 5 6h3" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2.5 2.5"/></svg>`,
  users: `<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 20c.7-3.6 3-5.5 5.5-5.5s4.8 1.9 5.5 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M15.5 5.5c1.6.3 2.8 1.7 2.8 3.4 0 1.7-1.2 3.1-2.8 3.4M17.5 14.7c2 .5 3.4 2.2 4 4.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  empty: `<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  refresh: `<svg viewBox="0 0 24 24" fill="none"><path d="M20 11A8 8 0 106.5 16.5M20 11V5M20 11h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  history: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.8"/><path d="M12 9v4l2.6 2.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 3.5L5 6M15.5 3.5L19 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`
};

/* ---------------- State ---------------- */
let state = {
  users: [],
  locks: [],
  routes: [],
  currentUser: null,
  loading: true,
  activeTab: 'dashboard',
  filters: { status:'all', destination:'all', agency:'all', search:'' },
  masterFilters: { search:'' },
  selected: new Set(),
  modal: null,
  exportMenuOpen: null,
  toasts: [],
  loginError: '',
  dashboardStatusFilter: 'all',
  dashboardDestFilter: null
};

/* ---------------- Storage helpers ----------------
   Prefers window.storage (syncs across everyone using this file inside
   Claude's artifact panel). If that API isn't present — e.g. the file was
   downloaded and opened directly in a browser, or hosted elsewhere — it
   falls back to the browser's own localStorage so uploads still survive
   a refresh or logout/login. localStorage in that fallback case is only
   local to that one browser, not shared between different computers. */
const LS_PREFIX = 'sealtrack_';
const hasCloudStorage = () => (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');

async function storageGet(key){
  if(hasCloudStorage()){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; } // key not yet created
  }
  try{
    const v = localStorage.getItem(LS_PREFIX + key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
async function storageSet(key, val){
  if(hasCloudStorage()){
    try{
      await window.storage.set(key, JSON.stringify(val), true);
      return true;
    }catch(e){
      // fall through and try a local backup so the edit isn't lost
    }
  }
  try{
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(val));
    return true;
  }catch(e){
    pushToast('Could not save changes — your browser storage may be full or blocked.', 'err');
    return false;
  }
}

function genId(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function nowStamp(){
  const d = new Date();
  return d.toISOString();
}
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}

/* ---------------- Init / defaults ---------------- */
async function initApp(){
  let users = await storageGet('st:users');
  if(!users || !Array.isArray(users) || users.length === 0){
    users = [{ id: genId('u'), username:'admin', password:'admin123', role:'admin', destination:'Head Office', createdAt: nowStamp() }];
    await storageSet('st:users', users);
  }
  let locks = await storageGet('st:locks');
  if(!locks) locks = [];
  let routes = await storageGet('st:routes');
  if(!routes) routes = [];

  state.users = users;
  state.locks = locks;
  state.routes = routes;

  if(expireOldReceivedLocks() > 0){
    await storageSet('st:locks', state.locks);
  }

  state.loading = false;
  render();
  startAutoSync();
}

/* ---------------- 24-hour received → available cycle ----------------
   A "Received / Complete" status is a snapshot of the last 4 hours, not a
   permanent state — it mirrors the physical lock being freed up for reuse
   once a delivery is confirmed. Any lock still sitting in "received" more
   than 4 hours after its receivedAt timestamp automatically rolls back
   into Available stock. The leg that just closed out is preserved in the
   lock's history first, so it still shows up permanently under
   History → "Received here" (just marked as "Since moved on" rather than
   "On-site now") — only the live Received/Available counts are affected. */
const RECEIVED_WINDOW_MS = 4 * 60 * 60 * 1000;
function expireOldReceivedLocks(){
  const now = Date.now();
  let expired = 0;
  state.locks.forEach(l=>{
    if(l.status !== 'received' || !l.receivedAt) return;
    const receivedTime = new Date(l.receivedAt).getTime();
    if(isNaN(receivedTime) || (now - receivedTime) < RECEIVED_WINDOW_MS) return;
    if(!Array.isArray(l.history)) l.history = [];
    l.history.push({
      id: genId('hist'), agency: l.agency, plate: l.plate,
      origin: l.origin, destination: l.destination,
      assignedAt: l.assignedAt, receivedAt: l.receivedAt
    });
    Object.assign(l, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null});
    expired++;
  });
  return expired;
}

/* ---------------- Cross-device sync ----------------
   Any device that opens this artifact inside Claude reads/writes the same
   window.storage keys, so logging in on a different laptop or desktop
   always pulls the latest shared data. To also catch changes made by
   someone else while this tab stays open, poll for updates periodically
   and merge them in — skipped while a modal is open so we don't blow away
   whatever the person is currently typing. */
let autoSyncTimer = null;
function startAutoSync(){
  if(autoSyncTimer) return;
  autoSyncTimer = setInterval(()=>{ pullLatestData(false); }, 15000);
}
async function pullLatestData(isManual){
  if(!state.currentUser) return;
  if(state.modal){
    if(isManual) pushToast('Close the open dialog before refreshing.', 'err');
    return;
  }
  try{
    const [users, locks, routes] = await Promise.all([
      storageGet('st:users'), storageGet('st:locks'), storageGet('st:routes')
    ]);
    let changed = false;
    if(users && JSON.stringify(users) !== JSON.stringify(state.users)){
      state.users = users;
      const stillExists = users.find(u=>u.id===state.currentUser.id);
      if(!stillExists){
        state.currentUser = null;
        pushToast('Your account was removed by an admin.', 'err');
        render();
        return;
      }
      state.currentUser = stillExists;
      changed = true;
    }
    if(locks && JSON.stringify(locks) !== JSON.stringify(state.locks)){ state.locks = locks; changed = true; }
    if(routes && JSON.stringify(routes) !== JSON.stringify(state.routes)){ state.routes = routes; changed = true; }

    const expiredCount = expireOldReceivedLocks();
    if(expiredCount > 0){
      changed = true;
      await storageSet('st:locks', state.locks);
    }

    if(changed) render();
    if(isManual) pushToast(changed ? 'Data refreshed — showing the latest.' : 'Already up to date.', 'ok');
  }catch(e){
    if(isManual) pushToast('Could not refresh right now.', 'err');
  }
}
function manualRefresh(){ pullLatestData(true); }
function renderSyncBadge(light){
  if(hasCloudStorage()){
    return `<div class="sync-badge ${light?'sync-ok-light':'sync-ok'}" title="Saved to Claude's shared storage — every device that opens this artifact sees the same data.">☁&nbsp; Synced across devices</div>`;
  }
  return `<div class="sync-badge ${light?'sync-warn-light':'sync-warn'}" title="No shared storage detected, so data is only being saved in this browser. Open this artifact inside Claude (not as a downloaded file) on every device to keep data in sync.">⚠&nbsp; This device only — not synced</div>`;
}

/* ---------------- Toasts ---------------- */
function pushToast(msg, type){
  const id = genId('t');
  state.toasts.push({id, msg, type: type||'ok'});
  renderToastsOnly();
  setTimeout(()=>{
    state.toasts = state.toasts.filter(t=>t.id!==id);
    renderToastsOnly();
  }, 3200);
}
function renderToastsOnly(){
  const el = document.getElementById('toastStack');
  if(!el) return;
  el.innerHTML = state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':(t.type==='ok'?'ok':'')}">${escapeHtml(t.msg)}</div>`).join('');
}

/* ---------------- Utils ---------------- */
function escapeHtml(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function distinctList(arr, key){
  const set = new Set();
  arr.forEach(x=>{ if(x[key] && String(x[key]).trim()) set.add(String(x[key]).trim()); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allDestinations(){
  const set = new Set();
  state.routes.forEach(r=>r.destination && set.add(r.destination));
  state.locks.forEach(l=>l.destination && set.add(l.destination));
  state.users.forEach(u=>u.destination && set.add(u.destination));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function allAgencies(){
  const set = new Set();
  state.routes.forEach(r=>r.agency && set.add(r.agency));
  state.locks.forEach(l=>l.agency && set.add(l.agency));
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function visibleLocksBase(){
  // scope by role
  if(state.currentUser && state.currentUser.role === 'destination'){
    const loc = state.currentUser.destination;
    return state.locks.filter(l =>
      l.destination === loc ||                              // currently at / heading to this location
      (l.origin === loc && l.status === 'assigned')          // sent out by this location, still in-transit elsewhere
    );
  }
  return state.locks;
}
/* True if this lock was sent out by the current user's own location and is
   now travelling toward somewhere else — kept visible for tracking, but it
   isn't physically on-site here anymore. */
function isOutgoingForCurrentUser(lock){
  const u = state.currentUser;
  if(!u || u.role !== 'destination' || !u.destination) return false;
  return lock.origin === u.destination && lock.destination !== u.destination && lock.status === 'assigned';
}
/* Custody rule: once a lock is RECEIVED at a destination, only the account
   whose own location matches that destination is allowed to forward it
   onward (the destination effectively becomes the new sender/origin —
   the "return process"). The original sender/origin account loses the
   ability to reassign that specific unit once it has been received. */
function isCurrentHolder(lock){
  const u = state.currentUser;
  if(!u || !u.destination) return false;
  return lock.destination === u.destination;
}

/* Full chain-of-custody for one lock: past archived legs plus its current
   leg, oldest first. Used both for a per-lock audit view and for building
   a location's aggregate received/sent history below. */
function getLockLegs(lock){
  const past = Array.isArray(lock.history) ? lock.history : [];
  const legs = past.map(h => ({...h, isCurrent:false}));
  if(lock.agency || lock.plate || lock.origin || lock.destination){
    legs.push({
      id: lock.id + '_current', agency: lock.agency, plate: lock.plate,
      origin: lock.origin, destination: lock.destination,
      assignedAt: lock.assignedAt, receivedAt: lock.receivedAt,
      isCurrent: true, currentStatus: lock.status
    });
  }
  return legs.sort((a,b)=> new Date(a.assignedAt||0) - new Date(b.assignedAt||0));
}

/* Aggregate history for the logged-in destination account: every time a
   unit was received here, and every time a unit was sent/returned out
   from here — scanning every lock's full chain, not just what's
   currently visible, so units that have since moved on stay in the log. */
function getDestinationHistory(){
  const u = state.currentUser;
  if(!u || !u.destination) return {received:[], sent:[]};
  const loc = u.destination;
  const received = [];
  const sent = [];
  state.locks.forEach(l=>{
    getLockLegs(l).forEach(leg=>{
      if(leg.destination === loc && leg.receivedAt){
        received.push({
          lockNo: l.lockNo, agency: leg.agency, plate: leg.plate,
          counterparty: leg.origin, date: leg.receivedAt,
          isCurrent: !!leg.isCurrent && l.status==='received'
        });
      }
      if(leg.origin === loc && (leg.receivedAt || !leg.isCurrent || l.status==='assigned')){
        sent.push({
          lockNo: l.lockNo, agency: leg.agency, plate: leg.plate,
          counterparty: leg.destination, date: leg.assignedAt,
          status: leg.isCurrent ? l.status : 'received'
        });
      }
    });
  });
  received.sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
  sent.sort((a,b)=> new Date(b.date||0) - new Date(a.date||0));
  return {received, sent};
}
function applyFilters(list){
  const f = state.filters;
  return list.filter(l=>{
    if(f.status !== 'all' && l.status !== f.status) return false;
    if(f.destination !== 'all' && l.destination !== f.destination) return false;
    if(f.agency !== 'all' && l.agency !== f.agency) return false;
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = [l.lockNo,l.agency,l.plate,l.origin,l.destination].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

/* ---------------- Render root ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  const app = document.getElementById('app');
  if(state.loading){
    app.innerHTML = `<div class="login-wrap"><div style="color:#fff;font-family:var(--font-display);font-size:15px;">Loading SealTrack…</div></div>`;
    return;
  }
  if(!state.currentUser){
    app.innerHTML = renderLogin();
  } else {
    app.innerHTML = renderShell();
  }
  app.insertAdjacentHTML('beforeend', `<div class="toast-stack" id="toastStack">${state.toasts.map(t=>`<div class="toast ${t.type==='err'?'err':''}">${escapeHtml(t.msg)}</div>`).join('')}</div>`);

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ---------------- Login screen ---------------- */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">${ICONS.seal}<span class="brand-name">SealTrack</span></div>
      <p class="brand-sub">GPS Truck Lock tracking &amp; chain-of-custody</p>
      ${state.loginError ? `<div class="login-error">${escapeHtml(state.loginError)}</div>` : ''}
      <form onsubmit="handleLogin(event)">
        <div class="field">
          <label for="loginUser">Username</label>
          <input id="loginUser" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPass">Password</label>
          <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block login-btn">Log in</button>
      </form>
      ${renderSyncBadge(true)}
    </div>
  </div>`;
}

function handleLogin(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const match = state.users.find(x=>x.username.toLowerCase() === u.toLowerCase() && x.password === p);
  if(!match){
    state.loginError = 'Incorrect username or password.';
    render();
    return;
  }
  state.loginError = '';
  state.currentUser = match;
  state.activeTab = 'dashboard';
  state.filters = { status:'all', destination: match.role==='destination'? match.destination : 'all', agency:'all', search:'' };
  render();
  pushToast(`Welcome back, ${match.username}.`, 'ok');
}

function handleLogout(){
  state.currentUser = null;
  state.selected = new Set();
  render();
}

/* ---------------- Shell (post-login) ---------------- */
function renderShell(){
  const isAdmin = state.currentUser.role === 'admin';
  const tabs = [
    {id:'dashboard', label:'Dashboard', icon:ICONS.dash},
    {id:'locks', label: isAdmin ? 'GPS Locks' : 'My GPS Locks', icon:ICONS.lock},
  ];
  if(isAdmin) tabs.push({id:'master', label:'Master Data', icon:ICONS.route});
  if(!isAdmin) tabs.push({id:'history', label:'History', icon:ICONS.history});
  if(isAdmin) tabs.push({id:'settings', label:'Users & Settings', icon:ICONS.users});
  if(!isAdmin) tabs.push({id:'account', label:'My Account', icon:ICONS.users});

  return `
  <div class="shell">
    <div class="sidebar">
      <div class="sb-brand">${ICONS.seal}<span class="sb-brand-text">SealTrack</span></div>
      ${tabs.map(t=>`
        <button class="nav-item ${state.activeTab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.icon}<span>${t.label}</span></button>
      `).join('')}
      <div class="sb-footer">
        ${renderSyncBadge()}
        <div class="sb-user">
          <b>${escapeHtml(state.currentUser.username)}</b>
          ${isAdmin ? `<span class="tag-pill tag-admin">Admin</span> <span class="tag-pill tag-dest">${escapeHtml(state.currentUser.destination||'No location set')}</span>` : `<span class="tag-pill tag-dest">${escapeHtml(state.currentUser.destination||'—')}</span>`}
        </div>
        <button class="nav-item" onclick="manualRefresh()">${ICONS.refresh}<span>Refresh data</span></button>
        <button class="nav-item" onclick="handleLogout()">${ICONS.logout}<span>Log out</span></button>
      </div>
    </div>
    <div class="main">
      ${renderTab()}
    </div>
  </div>`;
}

function setTab(tab){
  state.activeTab = tab;
  state.selected = new Set();
  state.exportMenuOpen = null;
  render();
}

function renderTab(){
  switch(state.activeTab){
    case 'dashboard': return renderDashboard();
    case 'locks': return renderLocksTab();
    case 'master': return renderMasterTab();
    case 'history': return renderHistoryTab();
    case 'settings': return renderSettingsTab();
    case 'account': return renderAccountTab();
    default: return renderDashboard();
  }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const isAdmin = state.currentUser.role === 'admin';
  const scoped = visibleLocksBase();
  const total = scoped.length;
  const available = scoped.filter(l=>l.status==='available').length;
  const assigned = scoped.filter(l=>l.status==='assigned').length;
  const received = scoped.filter(l=>l.status==='received').length;
  const maintenance = scoped.filter(l=>l.status==='maintenance').length;

  const df = state.dashboardDestFilter;

  let byDest = '';
  if(isAdmin){
    const dests = allDestinations();
    const rows = dests.map(d=>{
      const dl = state.locks.filter(l=>l.destination===d);
      return {
        d,
        atDestination: dl.filter(l=>l.status==='received').length,
        inTransit: dl.filter(l=>l.status==='assigned').length
      };
    }).filter(r=>r.atDestination>0 || r.inTransit>0).sort((a,b)=> b.atDestination - a.atDestination || a.d.localeCompare(b.d));

    byDest = `
      <div class="panel">
        <p class="panel-title">Locks by destination</p>
        <p class="panel-sub">How many GPS truck locks were received at each destination in the last 4 hours. Locks automatically return to Available stock after that. Click a destination to filter recent activity.</p>
        ${rows.length ? `
        <div class="dest-grid">
          ${rows.map(r=>`
            <div class="dest-card ${df===r.d?'is-active':''}" onclick="setDashboardDestFilter(decodeURIComponent('${encodeURIComponent(r.d)}'))" role="button" tabindex="0">
              <div class="dest-card-name">${escapeHtml(r.d)}</div>
              <div class="dest-card-value">${r.atDestination}</div>
              <div class="dest-card-sub">received, last 4h</div>
              <div class="dest-card-sub2">${r.inTransit} in-transit</div>
            </div>
          `).join('')}
        </div>` : `<p class="helper-text">No locks assigned yet.</p>`}
      </div>`;
  }

  const sf = state.dashboardStatusFilter;
  let recentPool = scoped;
  if(df) recentPool = recentPool.filter(l=>l.destination===df);
  if(sf !== 'all') recentPool = recentPool.filter(l=>l.status===sf);
  const dateKeyFor = l => sf==='received' ? l.receivedAt : (sf==='available' ? l.createdAt : (sf==='maintenance' ? l.maintenanceAt : (l.assignedAt||l.createdAt)));
  const recent = [...recentPool]
    .sort((a,b)=> new Date(dateKeyFor(b)||0) - new Date(dateKeyFor(a)||0))
    .slice(0, 10);

  const statusLabels = {all:'All statuses', available:'Available', assigned:'Assigned / In-transit', received:'Received / Complete', maintenance:'Under Maintenance'};
  const dateColLabel = sf==='received' ? 'Received' : (sf==='available' ? 'Added' : (sf==='maintenance' ? 'Tagged' : 'Assigned'));
  const filterActive = sf!=='all' || !!df;
  const filterDescParts = [];
  if(df) filterDescParts.push(`at "${escapeHtml(df)}"`);
  if(sf!=='all') filterDescParts.push(`status "${escapeHtml(statusLabels[sf])}"`);

  return `
    <div class="topbar">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-sub">${isAdmin? 'Fleet-wide overview of every GPS truck lock.' : `Overview for ${escapeHtml(state.currentUser.destination||'')}.`}</p>
      </div>
    </div>
    <div class="grid-cards">
      <div class="stat-card c-total ${sf==='all' && !df?'is-active':''}" onclick="setDashboardFilter('all')" role="button" tabindex="0"><div class="stat-label">Total Locks</div><div class="stat-value">${total}</div></div>
      <div class="stat-card c-available ${sf==='available' && !df?'is-active':''}" onclick="setDashboardFilter('available')" role="button" tabindex="0"><div class="stat-label">Available</div><div class="stat-value">${available}</div></div>
      <div class="stat-card c-assigned ${sf==='assigned' && !df?'is-active':''}" onclick="setDashboardFilter('assigned')" role="button" tabindex="0"><div class="stat-label">Assigned / In-transit</div><div class="stat-value">${assigned}</div></div>
      <div class="stat-card c-received ${sf==='received' && !df?'is-active':''}" onclick="setDashboardFilter('received')" role="button" tabindex="0"><div class="stat-label">Received / Complete (4h)</div><div class="stat-value">${received}</div></div>
      <div class="stat-card c-maintenance ${sf==='maintenance' && !df?'is-active':''}" onclick="setDashboardFilter('maintenance')" role="button" tabindex="0"><div class="stat-label">Under Maintenance</div><div class="stat-value">${maintenance}</div></div>
    </div>
    <div class="two-col">
      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <div>
            <p class="panel-title">Recent activity ${filterActive ? `— ${filterDescParts.join(', ')}` : ''}</p>
            <p class="panel-sub">${filterActive ? `Showing locks ${filterDescParts.join(' and ')}.` : 'Most recently assigned locks. Click a card above to filter.'}</p>
          </div>
          ${filterActive ? `<button class="btn btn-ghost btn-sm" onclick="setDashboardFilter('all')">Clear filter</button>` : ''}
        </div>
        ${recent.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Lock No.</th><th>Status</th><th>Plate</th><th>Route</th><th>${dateColLabel}</th></tr></thead>
          <tbody>
            ${recent.map(l=>`
              <tr>
                <td class="mono">${escapeHtml(l.lockNo)}</td>
                <td>${statusBadge(l.status, l.maintenanceType)}${isOutgoingForCurrentUser(l) ? ' <span class="badge badge-outgoing">Outgoing</span>' : ''}</td>
                <td class="mono">${escapeHtml(l.plate||'—')}</td>
                <td>${escapeHtml(l.origin||'—')} → ${escapeHtml(l.destination||'—')}</td>
                <td>${fmtDate(dateKeyFor(l))}</td>
              </tr>`).join('')}
          </tbody>
        </table></div>` : emptyState('No matching activity', filterActive ? 'No locks match this filter yet.' : 'Bulk upload some GPS locks to get started.')}
      </div>
      ${byDest}
    </div>
  `;
}

function setDashboardFilter(status){
  state.dashboardStatusFilter = status;
  state.dashboardDestFilter = null;
  render();
}
function setDashboardDestFilter(dest){
  if(state.dashboardDestFilter === dest){
    state.dashboardDestFilter = null;
    state.dashboardStatusFilter = 'all';
  } else {
    state.dashboardDestFilter = dest;
    state.dashboardStatusFilter = 'received';
  }
  render();
}


function statusBadge(status, maintenanceType){
  if(status==='available') return `<span class="badge badge-available">Available</span>`;
  if(status==='assigned') return `<span class="badge badge-assigned">In-transit</span>`;
  if(status==='received') return `<span class="badge badge-received">Received</span>`;
  if(status==='maintenance') return `<span class="badge badge-maintenance">${maintenanceType==='charging'?'For Charging':'Under Repair'}</span>`;
  return `<span class="badge">${escapeHtml(status)}</span>`;
}
function emptyState(title, sub){
  return `<div class="empty-state">${ICONS.empty}<h4>${escapeHtml(title)}</h4><p>${escapeHtml(sub)}</p></div>`;
}

/* ---------------- GPS Locks tab ---------------- */
function renderLocksTab(){
  const isAdmin = state.currentUser.role === 'admin';
  const base = visibleLocksBase();
  const list = applyFilters(base);
  const dests = isAdmin ? allDestinations() : [state.currentUser.destination];
  const agencies = allAgencies();

/* ---------------- Filters / selection ---------------- */
function updateFilter(key, val){
  state.filters[key] = val;
  render();
}
function resetFilters(){
  state.filters = { status:'all', destination: state.currentUser.role==='destination'? state.currentUser.destination : 'all', agency:'all', search:'' };
  render();
}
function toggleSelect(id, checked){
  if(checked) state.selected.add(id); else state.selected.delete(id);
  render();
}
function toggleSelectAll(cb, ids){
  if(cb.checked) ids.forEach(id=>state.selected.add(id));
  else ids.forEach(id=>state.selected.delete(id));
  render();
}
function clearSelection(){ state.selected = new Set(); render(); }

/* ---------------- Lock actions ---------------- */
async function markReceived(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  lock.status = 'received';
  lock.receivedAt = nowStamp();
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} marked as received.`, 'ok');
  render();
}
async function bulkMarkReceived(){
  let n=0;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id) && l.status==='assigned'){
      l.status='received'; l.receivedAt = nowStamp(); n++;
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${n} lock(s) marked as received.`, 'ok');
  render();
}
async function unassignLock(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(!confirm(`Return lock ${lock.lockNo} to Available? This clears its assignment.`)) return;
  Object.assign(lock, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null});
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} returned to available.`, 'ok');
  render();
}
async function bulkUnassign(){
  if(!confirm(`Return ${state.selected.size} lock(s) to Available?`)) return;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id)){
      Object.assign(l, {status:'available', agency:'', plate:'', origin:'', destination:'', assignedAt:null, receivedAt:null});
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast('Selected locks returned to available.', 'ok');
  render();
}

/* ---------------- Maintenance (Under Repair / For Charging) ----------------
   A quick way to pull an available unit out of the usable pool without
   assigning it to a route — e.g. it's physically broken or on the
   charger. While tagged "maintenance" it's excluded from Available stock
   and from route assignment. "Done Maintenance" puts it straight back
   into Available. */
async function tagMaintenance(id, type){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(lock.status !== 'available'){
    pushToast('Only available units can be tagged for maintenance.', 'err');
    return;
  }
  lock.status = 'maintenance';
  lock.maintenanceType = type;
  lock.maintenanceAt = nowStamp();
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} tagged as ${type==='charging'?'For Charging':'Under Repair'}.`, 'ok');
  render();
}
async function bulkTagMaintenance(type){
  let n=0;
  const stamp = nowStamp();
  state.locks.forEach(l=>{
    if(state.selected.has(l.id) && l.status==='available'){
      l.status='maintenance'; l.maintenanceType=type; l.maintenanceAt=stamp; n++;
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${n} lock(s) tagged as ${type==='charging'?'For Charging':'Under Repair'}.`, 'ok');
  render();
}
async function doneMaintenance(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  lock.status = 'available';
  lock.maintenanceType = null;
  lock.maintenanceAt = null;
  await storageSet('st:locks', state.locks);
  pushToast(`Lock ${lock.lockNo} is back in Available stock.`, 'ok');
  render();
}
async function bulkDoneMaintenance(){
  let n=0;
  state.locks.forEach(l=>{
    if(state.selected.has(l.id) && l.status==='maintenance'){
      l.status='available'; l.maintenanceType=null; l.maintenanceAt=null; n++;
    }
  });
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast(`${n} lock(s) returned to Available stock.`, 'ok');
  render();
}

async function deleteLock(id){
  const lock = state.locks.find(l=>l.id===id);
  if(!lock) return;
  if(!confirm(`Delete lock ${lock.lockNo} permanently?`)) return;
  state.locks = state.locks.filter(l=>l.id!==id);
  await storageSet('st:locks', state.locks);
  pushToast('Lock deleted.', 'ok');
  render();
}
async function bulkDeleteLocks(){
  if(!confirm(`Delete ${state.selected.size} lock(s) permanently?`)) return;
  state.locks = state.locks.filter(l=>!state.selected.has(l.id));
  await storageSet('st:locks', state.locks);
  state.selected = new Set();
  pushToast('Selected locks deleted.', 'ok');
  render();
}

/* ---------------- Modal system ---------------- */
function openModal(type, ids){
  const resolvedIds = ids || Array.from(state.selected);
  if(type === 'assign'){
    const targetLocks = state.locks.filter(l=>resolvedIds.includes(l.id));
    const blocked = targetLocks.some(l => l.status==='received' && !isCurrentHolder(l));
    if(blocked){
      pushToast("These units were already received — only the destination that holds them can forward them onward.", 'err');
      return;
    }
    if(targetLocks.some(l=>l.status==='available') && state.currentUser.role!=='admin'){
      pushToast('Only an admin can assign units from available stock.', 'err');
      return;
    }
  }
  state.modal = { type, ids: resolvedIds };
  render();
}
function closeModal(){
  state.modal = null;
  render();
}

function renderModal(){
  const m = state.modal;
  if(m.type === 'bulkLocks') return modalBulkLocks();
  if(m.type === 'assign') return modalAssign(m.ids);
  if(m.type === 'editLock') return modalEditLock(m.ids[0]);
  if(m.type === 'lockHistory') return modalLockHistory(m.ids[0]);
  if(m.type === 'bulkRoutes') return modalBulkRoutes();
  if(m.type === 'addRoute') return modalAddRoute();
  if(m.type === 'editRoute') return modalEditRoute(m.ids[0]);
  if(m.type === 'addUser') return modalAddUser();
  if(m.type === 'editUser') return modalEditUser(m.ids[0]);
  return '';
}

  `;

async function submitBulkLocks(){
  const fileInput = document.getElementById('bulkLockFile');
  const text = document.getElementById('bulkLockText').value;
  let numbers = [];

  if(fileInput && fileInput.files && fileInput.files[0]){
    try{
      numbers = await extractLockNumbersFromFile(fileInput.files[0]);
    }catch(e){
      pushToast('Could not read that file. Please check the format.', 'err');
      return;
    }
  }
  if(text.trim()){
    text.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).forEach(n=>numbers.push(n));
  }
  numbers = Array.from(new Set(numbers.map(n=>n.trim()).filter(Boolean)));

  if(numbers.length===0){
    pushToast('No lock numbers found to upload.', 'err');
    return;
  }
  const existing = new Set(state.locks.map(l=>l.lockNo.toLowerCase()));
  let added=0, skipped=0;
  numbers.forEach(n=>{
    if(existing.has(n.toLowerCase())){ skipped++; return; }
    state.locks.push({
      id: genId('lk'), lockNo: n, status:'available',
      agency:'', plate:'', origin:'', destination:'',
      assignedAt:null, receivedAt:null, createdAt: nowStamp(),
      maintenanceType:null, maintenanceAt:null,
      history: []
    });
    existing.add(n.toLowerCase());
    added++;
  });
  await storageSet('st:locks', state.locks);
  closeModal();
  pushToast(`${added} lock(s) added.${skipped? ' '+skipped+' duplicate(s) skipped.':''}`, 'ok');
}

function extractLockNumbersFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        if(rows.length===0){ resolve([]); return; }
        const headerKeys = Object.keys(rows[0]);
        const candidates = ['lock no','lock number','gps lock no','gps lock number','gps truck lock','serial no','serial number','lock','id'];
        let col = headerKeys.find(h => candidates.includes(String(h).trim().toLowerCase()));
        if(!col) col = headerKeys[0];
        const vals = rows.map(r=>String(r[col]||'').trim()).filter(Boolean);
        resolve(vals);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function fillFromRoute(routeId){
  const r = state.routes.find(x=>x.id===routeId);
  if(!r) return;
  document.getElementById('assignAgency').value = r.agency||'';
  document.getElementById('assignPlate').value = r.plate||'';
  document.getElementById('assignOrigin').value = r.origin||'';
  document.getElementById('assignDestination').value = r.destination||'';
}

async function submitAssign(ids){
  const agency = document.getElementById('assignAgency').value.trim();
  const plate = document.getElementById('assignPlate').value.trim();
  const origin = document.getElementById('assignOrigin').value.trim();
  const destination = document.getElementById('assignDestination').value.trim();
  if(!agency || !plate || !origin || !destination){
    pushToast('Please fill in agency, plate, origin and destination.', 'err');
    return;
  }
  const targetLocks = state.locks.filter(l=>ids.includes(l.id));
  const blocked = targetLocks.some(l => l.status==='received' && !isCurrentHolder(l));
  if(blocked){
    pushToast("Can't forward — you're not the destination currently holding these units.", 'err');
    closeModal();
    return;
  }
  const stamp = nowStamp();
  state.locks.forEach(l=>{
    if(ids.includes(l.id)){
      if(l.status === 'received'){
        // Forwarding a received lock — archive the leg that just completed
        // so it's preserved in history for whoever held it.
        if(!Array.isArray(l.history)) l.history = [];
        l.history.push({
          id: genId('hist'), agency: l.agency, plate: l.plate,
          origin: l.origin, destination: l.destination,
          assignedAt: l.assignedAt, receivedAt: l.receivedAt
        });
      }
      Object.assign(l, {agency, plate, origin, destination, status:'assigned', assignedAt: stamp, receivedAt:null});

  `;

  return modalShell('Bulk upload agency / plate / route list', 'Add many agency-plate-route entries at once.', body, footer);
}
function downloadRouteTemplate(){
  const ws = XLSX.utils.json_to_sheet([{Agency:'', Plate:'', Origin:'', Destination:''}]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, 'sealtrack_route_template.xlsx');
}
async function submitBulkRoutes(){
  const fileInput = document.getElementById('bulkRouteFile');
  if(!fileInput.files || !fileInput.files[0]){ pushToast('Please choose a file to upload.', 'err'); return; }
  try{
    const rows = await extractRowsFromFile(fileInput.files[0]);
    if(rows.length===0){ pushToast('No rows found in that file.', 'err'); return; }
    const headerMap = mapHeaders(Object.keys(rows[0]), {
      agency:['agency','agency name'],
      plate:['plate','plate no','plate number','truck plate','plate #'],
      origin:['origin','from','origin point'],
      destination:['destination','to','dest']
    });
    let added=0;
    rows.forEach(row=>{
      const agency = String(row[headerMap.agency]||'').trim();
      const plate = String(row[headerMap.plate]||'').trim();
      const origin = String(row[headerMap.origin]||'').trim();
      const destination = String(row[headerMap.destination]||'').trim();
      if(!agency && !plate && !origin && !destination) return;
      state.routes.push({id: genId('rt'), agency, plate, origin, destination, createdAt: nowStamp()});
      added++;
    });
    await storageSet('st:routes', state.routes);
    closeModal();
    pushToast(`${added} route(s) added to master data.`, 'ok');
  }catch(e){
    pushToast('Could not read that file. Please check the format.', 'err');
  }
}
function mapHeaders(headers, wanted){
  const lower = headers.map(h=>String(h).trim().toLowerCase());
  const result = {};
  Object.keys(wanted).forEach(key=>{
    let idx = -1;
    for(const cand of wanted[key]){
      idx = lower.indexOf(cand);
      if(idx>-1) break;
    }
    result[key] = idx>-1 ? headers[idx] : headers[0];
  });
  return result;
}
function extractRowsFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, {defval:''}));
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

  if(role==='admin' && state.users.filter(x=>x.role==='admin').length===1 && u.role==='admin'){
    // allow, still one admin remains (itself), just proceed
  }
  u.role = role;
  u.destination = destination;
  if(pass){ if(pass.length<4){ pushToast('Password should be at least 4 characters.', 'err'); return; } u.password = pass; }
  await storageSet('st:users', state.users);
  if(u.id===state.currentUser.id) state.currentUser = u;
  closeModal();
  pushToast('User updated.', 'ok');
}
async function deleteUser(id){
  const u = state.users.find(x=>x.id===id);
  if(!u) return;
  if(u.role==='admin' && state.users.filter(x=>x.role==='admin').length===1){
    pushToast('You must keep at least one admin account.', 'err');
    return;
  }
  if(!confirm(`Delete user "${u.username}"?`)) return;
  state.users = state.users.filter(x=>x.id!==id);
  await storageSet('st:users', state.users);
  pushToast('User deleted.', 'ok');
  render();
}

/* ---------------- Export ---------------- */
function exportData(scope, format){
  state.exportMenuOpen = null;
  let rows = [];
  let filename = 'sealtrack_export';
  if(scope === 'locks'){
    const base = visibleLocksBase();
    const list = applyFilters(base);
    rows = list.map(l=>({
      'Lock No': l.lockNo,
      'Status': l.status==='available'?'Available':(l.status==='assigned'?'In-transit':(l.status==='received'?'Received':(l.status==='maintenance'?(l.maintenanceType==='charging'?'For Charging':'Under Repair'):l.status))),
      'Agency': l.agency||'',
      'Plate No': l.plate||'',
      'Origin': l.origin||'',
      'Destination': l.destination||'',
      'Assigned Date': l.assignedAt ? fmtDate(l.assignedAt) : '',
      'Received Date': l.receivedAt ? fmtDate(l.receivedAt) : ''
    }));
    filename = 'gps_locks_export';
  } else if(scope === 'routes'){
    rows = state.routes.map(r=>({Agency:r.agency, Plate:r.plate, Origin:r.origin, Destination:r.destination}));
    filename = 'master_route_list';
  } else if(scope === 'history'){
    const {received, sent} = getDestinationHistory();
    rows = [
      ...received.map(r=>({'Direction':'Received', 'Lock No':r.lockNo, 'Agency':r.agency||'', 'Plate No':r.plate||'', 'Counterparty':r.counterparty||'', 'Date':fmtDate(r.date), 'Status':r.isCurrent?'On-site now':'Since moved on'})),
      ...sent.map(s=>({'Direction':'Sent / Returned', 'Lock No':s.lockNo, 'Agency':s.agency||'', 'Plate No':s.plate||'', 'Counterparty':s.counterparty||'', 'Date':fmtDate(s.date), 'Status':s.status}))
    ];
    filename = 'destination_history';
  }
  if(rows.length===0){
    pushToast('Nothing to export yet.', 'err');
    render();
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  if(format==='xlsx'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data');
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  pushToast('Export ready — check your downloads.', 'ok');
  render();
}

/* ---------------- Boot ---------------- */
initApp();
