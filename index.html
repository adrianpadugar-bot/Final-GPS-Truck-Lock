  catch(e){ pushToast('Could not copy automatically. Select the code and copy it.', 'err'); }
}
// Apps Script web app: returns {ok, values:[[…]]}. Runs as the sheet owner, so the sheet itself can stay private.
async function fetchSheetScript(url){
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error('That is not an Apps Script web app link (it should start with https://script.google.com/macros/s/…/exec).');
  const res = await fetch(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now());
  if(!res.ok) throw new Error('Google returned ' + res.status);
  let data;
  try{ data = JSON.parse(await res.text()); }
  catch(e){ throw new Error('the web app did not return data. Deploy it as a Web app with access "Anyone" and use the link ending in /exec'); }
  if(!data.ok) throw new Error(data.error || 'the script reported an error');
  return data.values || [];
}
async function fetchPlateMatrix(){
  const script = (state.plateSheet.script||'').trim(), url = (state.plateSheet.url||'').trim();
  const problems = [];
  if(script){
    try{ return await fetchSheetScript(script); }
    catch(e){ problems.push('Apps Script: ' + plateErrText(e) + '.'); if(!url) throw new Error(problems.join(' ')); }
  }
  try{ return await fetchSheetMatrix(url, state.plateSheet.apiKey); }
  catch(e){ if(problems.length) throw new Error(problems.join(' ') + ' Sheet link: ' + e.message); throw e; }
}
function fetchSheetJsonp(id, gid){
  return new Promise((resolve, reject)=>{
    const cb = 'phJsonp' + Date.now();
    const sc = document.createElement('script');
    let done = false;
    const clean = ()=>{ try{ delete window[cb]; }catch(e){ window[cb] = undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); };
    window[cb] = (resp)=>{
      done = true; clean();
      if(!resp || resp.status==='error'){ reject(new Error((resp && resp.errors && resp.errors[0] && (resp.errors[0].detailed_message || resp.errors[0].message)) || 'Google refused the request')); return; }
      const cols = resp.table.cols.map(c=>c.label || '');
      const rows = resp.table.rows.map(r=>(r.c||[]).map(c=>c ? (c.f!=null ? c.f : (c.v==null ? '' : c.v)) : ''));
      resolve([cols, ...rows]);
    };
    sc.onerror = ()=>{ if(!done){ clean(); reject(new Error('the browser blocked the script request to Google')); } };
    sc.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=responseHandler:${cb}${gid?'&gid='+gid:''}&tq=${encodeURIComponent('select *')}&_=${Date.now()}`;
    document.head.appendChild(sc);
    setTimeout(()=>{ if(!done){ clean(); reject(new Error('Google did not answer (timed out)')); } }, 15000);
  });
}
async function fetchSheetMatrix(url, apiKey){
  const {id, published, gid} = parseSheetUrl(url);
  if(!id) throw new Error('That does not look like a Google Sheets link.');
  if(apiKey && !published){
    try{ return await fetchSheetApi(id, gid, apiKey); }
    catch(e){ try{ return await fetchSheetCsvMatrix(id, gid, published, url); }catch(e2){ throw new Error('Google Sheets API: '+plateErrText(e)); } }
  }
  try{ return await fetchSheetCsvMatrix(id, gid, published, url); }
  catch(e){
    if(published) throw e;                      // published keys can only be read as CSV
    try{ return await fetchSheetJsonp(id, gid); }  // second route: no CORS involved
    catch(e2){ throw new Error(e.message + ' Second route also failed: ' + plateErrText(e2) + '.'); }
  }
}
function parsePlateMatrix(m){
  const rows = m.filter(r=>Array.isArray(r) && r.some(c=>String(c==null?'':c).trim()!==''));
  if(!rows.length) return {headers:[], plateCol:0, rows:[]};
  let headers = rows[0].map(c=>String(c==null?'':c).trim());
  let plateCol = headers.findIndex(h=>/plate/i.test(h));
  let body = rows.slice(1);
  if(plateCol < 0){
    plateCol = 0;
    const first = normalizePlate(headers[0]);
    if(/^[A-Z0-9]{5,8}$/.test(first) && /[A-Z]/.test(first) && /\d/.test(first)){   // no header row: the first line is already a plate
      headers = headers.map((_,i)=> i===0 ? 'Plate No.' : 'Column '+(i+1));
      body = rows;
    }
  }
  const seen = new Set(), data = [];
  body.forEach(r=>{
    const cells = headers.map((_,i)=>String(r[i]==null?'':r[i]).trim());
    const plate = normalizePlate(cells[plateCol]);
    if(!plate || seen.has(plate)) return;
    seen.add(plate); cells[plateCol] = plate; data.push(cells);
  });
  return {headers, plateCol, rows:data};
}
// silent = background refresh: no loading flicker, no toast, only redraw when something changed.
async function loadPlates(silent){
  if(!plateConfigured()){ state.plateError = 'Add the Apps Script link or the Google Sheet link first.'; render(); return; }
  if(state.plateLoading) return;
  state.plateLoading = true;
  if(!silent){ state.plateError = ''; render(); }
  const before = JSON.stringify(state.plateData && state.plateData.rows) + '|' + state.plateError;
  try{
    const parsed = parsePlateMatrix(await fetchPlateMatrix());
    if(parsed.rows.length===0) throw new Error('No plate numbers found in that sheet.');
    const changed = JSON.stringify(parsed.rows) !== JSON.stringify(state.plateData && state.plateData.rows);
    state.plateData = {headers:parsed.headers, plateCol:parsed.plateCol, rows:parsed.rows, fetchedAt:nowStamp()};
    if(changed || !silent) await storageSet('st:platedata', state.plateData);
    state.plateError = '';
    plateChecked = new Date();
    if(!silent) pushToast(`${parsed.rows.length} plate number(s) loaded from the sheet.`, 'ok');
  }catch(e){
    state.plateError = e.message || 'Could not load the sheet.';
  }
  state.plateLoading = false;
  const after = JSON.stringify(state.plateData && state.plateData.rows) + '|' + state.plateError;
  if(!silent || before!==after) render();
}

function startPlatePolling(){

// Tells apart "this page cannot reach Google at all" from "Google is reachable but refuses to share the answer with this page".
async function plateDiagnose(){
  const script = (state.plateSheet.script||'').trim();
  const url = (state.plateSheet.url||'').trim();
  const {id, published, gid} = parseSheetUrl(url);
  if(!script && !id){ state.plateDiag = {lines:['Add the Apps Script link or a valid Google Sheet link first.'], ok:false}; render(); return; }
  const g = gid ? '&gid='+gid : '';
  const target = script ? script + (script.includes('?') ? '&' : '?') + '_=' + Date.now()
    : (published ? `https://docs.google.com/spreadsheets/d/e/${id}/pub?output=csv${g}&_=${Date.now()}`
                 : `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${g}&_=${Date.now()}`);
  const where = [];
  try{ where.push(window.top!==window.self ? 'embedded inside another page (an iframe or preview)' : 'a normal top-level page'); }catch(e){ where.push('embedded inside another page (an iframe or preview)'); }
  where.push('address starts with ' + (location.protocol || 'unknown'));
  let cors = '', noCors = false, ok = false;
  try{ const r = await fetch(target); if(r.ok){ ok = true; } else { cors = 'Google answered HTTP ' + r.status; } }catch(e){ cors = plateErrText(e); }
  if(!ok){ try{ await fetch(target, {mode:'no-cors'}); noCors = true; }catch(e){ noCors = false; } }
  const lines = ['This page is running as: ' + where.join(', ') + '.'];
  if(ok && script){
    try{ const v = await fetchSheetScript(script); lines.push(`Result: the Apps Script answered with ${v.length} row(s). The connection works — press Refresh now.`); }
    catch(e){ lines.push('Result: Google answered, but ' + plateErrText(e) + '.'); ok = false; }
  } else if(ok) lines.push('Result: Google answered and the page was allowed to read it. The connection works — press Refresh now.');
  else if(cors.startsWith('Google answered')) lines.push('Result: ' + cors + '. ' + (script ? 'Re-deploy the script as a Web app (Who has access: Anyone) and use the link ending in /exec.' : 'The link is reachable but is not published/shared correctly. Open it in a new tab: it should show the plate list as plain text.'));
  else if(noCors){
    lines.push('Result: Google is reachable, but it does not allow this page to read the answer (a browser CORS rule).');
    lines.push(script ? 'Open the Apps Script link in a new tab. If it shows {"ok":true,…}, deploy a new version with access "Anyone" and paste the new /exec link. If it asks you to sign in, the access setting is not "Anyone".'
              : (published ? 'Fix: use an Apps Script link (recommended), or the normal share link of the sheet instead of the published link.'
                           : 'The app also tried a second route; if that failed too, use an Apps Script link or add a Google API key.'));
  } else {
    lines.push('Result: this page is not allowed to make requests to Google at all. This happens in embedded previews (such as a preview panel) and with some browser extensions or firewalls.');
    lines.push('Fix: download the HTML file and open it directly in your browser (or host it on your own web server), then press Refresh now.');
  }
  state.plateDiag = {lines, ok};
  render();
}
async function savePlateUrl(){
  if(state.currentUser.role!=='admin') return;
  const script = (document.getElementById('plateScript').value||'').trim();
  const url = (document.getElementById('plateUrl').value||'').trim();
  const apiKey = (document.getElementById('plateKey').value||'').trim();
  if(script && !/^https:\/\/script\.google(usercontent)?\.com\//.test(script)){ pushToast('The Apps Script link should start with https://script.google.com/macros/s/…', 'err'); return; }
  if(url && !parseSheetUrl(url).id){ pushToast('That does not look like a Google Sheets link.', 'err'); return; }
  state.plateSheet = {url, apiKey, script};
  state.plateDiag = null;
  await storageSet('st:platesheet', state.plateSheet);
  if(script || url) await loadPlates(false); else { state.plateData = null; await storageSet('st:platedata', null); render(); }
}
function updatePlateFilter(key, val){ state.plateFilters[key] = val; render(); }
function plateUsage(){
  const map = new Map();
  state.locks.forEach(l=>{

    if(!map.has(k)) map.set(k, []);
    map.get(k).push(l);
  });
  return map;
}

async function submitReturnForm(){
  const l = state.locks.find(x=>x.id===state.returnForm.lockId);
  if(!canReturnLock(l)){ pushToast('Select a lock received by the destination.', 'err'); return; }
  const f = state.returnForm;
  const oldPlate = l.plate || '';
  let plate = oldPlate, note = oldPlate ? `Same plate ${oldPlate}` : '';
  if(f.choice==='new'){
    plate = normalizePlate(f.plate);
    if(!plate){ pushToast('Enter the new plate number.', 'err'); return; }
    note = plate===oldPlate ? `Same plate ${oldPlate}` : `New plate ${oldPlate||'—'} → ${plate}`;
  }
  Object.assign(l, {status:'returning', returnStartedAt: nowStamp(), plate});
  logTx(l, 'return_started', note);
  await storageSet('st:locks', state.locks);
  state.returnForm = { lockId:'', choice:'', plate:'' };
  pushToast(`Lock ${l.lockNo} is returning to ${l.origin||'its origin'}.`, 'ok');
  render();
}

/* ---------------- Truck Lock Assigning form ---------------- */
function normalizePlate(v){ return String(v==null?'':v).toUpperCase().replace(/\s+/g,''); }
function lockSortNo(a,b){ return String(a.lockNo).localeCompare(String(b.lockNo), undefined, {numeric:true, sensitivity:'base'}); }
function allocLeft(a){ return a.qty - allocUsedCount(a.destination, a.agency); }
// Available locks that may be assigned under this allocation, lowest serial first.
function eligibleLocksFor(a){
  if(allocLeft(a) <= 0) return [];
  const freeUnreserved = a.qty - allocUsedCount(a.destination, a.agency) - allocPendingReserved(a);
  return state.locks.filter(l=>{
    if(l.status!=='available') return false;
    const r = reservationOf(l.id);
    return r ? r.id===a.id : freeUnreserved>0;
  }).sort(lockSortNo);
}
// Admins can assign under any allocation; origin staff only under allocations from their own origin.
function canAssignUnder(a){
  const u = state.currentUser;
  return u.role==='admin' || (u.role==='origin' && sameStr(a.origin, u.origin));
}
function assignFormDestinations(){
  const seen = new Map();
  state.allocations.filter(a=>allocLeft(a)>0 && canAssignUnder(a)).forEach(a=>{ const k=a.destination.toLowerCase(); if(!seen.has(k)) seen.set(k,a.destination); });
  return Array.from(seen.values()).sort((x,y)=>x.localeCompare(y));
}
function assignFormAgencies(dest){
  return state.allocations.filter(a=>a.destination.toLowerCase()===dest.toLowerCase() && allocLeft(a)>0 && canAssignUnder(a))
    .sort((x,y)=>x.agency.localeCompare(y.agency));
}
function setAssignField(field, val){
  const f = state.assignForm;
  f[field] = val;
  if(field==='dest'){ f.agency=''; f.lockId=''; f.plate=''; }
  if(field==='agency'){ f.lockId=''; f.plate=''; }
  if(field==='lockId'){ f.plate=''; }
  render();
}
function onPlateInput(el){
  const pos = el.selectionStart==null ? el.value.length : el.selectionStart;
  const cleanBefore = normalizePlate(el.value.slice(0,pos));
  el.value = normalizePlate(el.value);
  try{ el.setSelectionRange(cleanBefore.length, cleanBefore.length); }catch(e){}
  state.assignForm.plate = el.value;
  const btn = document.getElementById('assignBtn');
  if(btn) btn.disabled = !el.value || btn.dataset.ready!=='1';
}
function renderAssignForm(){
  const f = state.assignForm;
  const dests = assignFormDestinations();
  if(f.dest && !dests.some(d=>d.toLowerCase()===f.dest.toLowerCase())){ f.dest=''; f.agency=''; f.lockId=''; f.plate=''; }
  const allocs = f.dest ? assignFormAgencies(f.dest) : [];
  if(f.agency && !allocs.some(a=>a.agency.toLowerCase()===f.agency.toLowerCase())){ f.agency=''; f.lockId=''; f.plate=''; }
  const alloc = (f.dest && f.agency) ? findAllocation(f.dest, f.agency) : null;
  const locks = alloc ? eligibleLocksFor(alloc) : [];
  if(f.lockId && !locks.some(l=>l.id===f.lockId)){ f.lockId=''; f.plate=''; }
  const ready = !!(alloc && alloc.origin && f.lockId);
  const sameCase = (x,y)=>String(x).toLowerCase()===String(y).toLowerCase();
  return `
    <div class="panel" style="margin-bottom:16px;">
      <p class="panel-title">Assign a truck lock</p>
      <p class="panel-sub">Choose the destination, then the agency, then the lock number, and type the plate number.${isOriginStaff()?` Only allocations from ${escapeHtml(state.currentUser.origin||'your origin')} are listed.`:''}</p>
      ${dests.length===0 ? `<p class="helper-text" style="color:var(--danger);">${isOriginStaff() ? 'No allocation from your origin has slots left. Ask an admin to add or extend one.' : 'No allocation has slots left. Add or extend allocations in the Allocation tab first.'}</p>` : `
      <div class="assign-grid">
        <div class="field">
          <label for="afDest"><span class="step-n">1</span>Destination</label>
          <select id="afDest" onchange="setAssignField('dest', this.value)">
            <option value="">Select destination</option>
            ${dests.map(d=>`<option value="${escapeHtml(d)}" ${sameCase(d,f.dest)?'selected':''}>${escapeHtml(d)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="afAgency"><span class="step-n">2</span>Agency</label>
          <select id="afAgency" onchange="setAssignField('agency', this.value)" ${f.dest?'':'disabled'}>
            <option value="">Select agency</option>
            ${allocs.map(a=>`<option value="${escapeHtml(a.agency)}" ${sameCase(a.agency,f.agency)?'selected':''}>${escapeHtml(a.agency)} (${allocLeft(a)} left)</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="afLock"><span class="step-n">3</span>Lock No.${alloc ? `<span class="remain-badge" title="Locks still assignable to this destination and agency">Remaining: ${Math.min(locks.length, allocLeft(alloc))}</span>` : ''}</label>
          <select id="afLock" onchange="setAssignField('lockId', this.value)" ${alloc?'':'disabled'}>
            <option value="">${alloc ? (locks.length ? 'Select lock no.' : 'No available locks') : 'Select lock no.'}</option>
            ${locks.map(l=>`<option value="${l.id}" ${l.id===f.lockId?'selected':''}>${escapeHtml(l.lockNo)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label for="afPlate"><span class="step-n">4</span>Truck plate no.</label>
          <input id="afPlate" placeholder="e.g. NGT4521" autocomplete="off" value="${escapeHtml(f.plate)}" oninput="onPlateInput(this)" ${f.lockId?'':'disabled'}>
          <div class="helper-text">Capital letters, no spaces.</div>
        </div>
      </div>
      ${alloc ? `<div class="assign-info">
        ${alloc.origin ? `<b>${escapeHtml(alloc.origin)}</b> → <b>${escapeHtml(alloc.destination)}</b>` : `<span style="color:var(--danger);">This allocation has no origin. Edit it in the Allocation tab first.</span>`}
        · ${escapeHtml(alloc.agency)} · ${allocLeft(alloc)} left of ${alloc.qty}
      </div>` : ''}
      <div style="margin-top:14px;">
        <button id="assignBtn" class="btn btn-accent" data-ready="${ready?'1':'0'}" ${(ready && f.plate)?'':'disabled'} onclick="submitAssignForm()">Assign</button>
      </div>`}
    </div>`;
}
async function submitAssignForm(){
  const f = state.assignForm;
  const alloc = (f.dest && f.agency) ? findAllocation(f.dest, f.agency) : null;
  const lock = state.locks.find(l=>l.id===f.lockId);
  const plate = normalizePlate(f.plate);
  if(!alloc){ pushToast('Select a destination and agency.', 'err'); return; }
  if(!canAssignUnder(alloc)){ pushToast("You can only assign under allocations from your own origin.", 'err'); return; }
  if(!lock){ pushToast('Select a lock number.', 'err'); return; }
  if(!plate){ pushToast('Enter the truck plate number.', 'err'); return; }
  if(!alloc.origin){ pushToast(`${alloc.agency} → ${alloc.destination} has no origin. Edit the allocation first.`, 'err'); return; }
  if(lock.status!=='available'){ pushToast(`Lock ${lock.lockNo} is not available.`, 'err'); return; }
  const r = reservationOf(lock.id);
  if(r && r.id!==alloc.id){ pushToast(`Lock ${lock.lockNo} is allocated to ${r.agency} → ${r.destination} and can't be assigned elsewhere.`, 'err'); return; }
  const used = allocUsedCount(alloc.destination, alloc.agency);
  if(used >= alloc.qty){ pushToast(`Exceeds allocation: ${alloc.agency} → ${alloc.destination} is full (${used}/${alloc.qty}).`, 'err'); return; }
  if(!r && alloc.qty - used - allocPendingReserved(alloc) <= 0){ pushToast(`The remaining slots in ${alloc.agency} → ${alloc.destination} are reserved for specific lock numbers.`, 'err'); return; }
  Object.assign(lock, {agency: alloc.agency, plate, origin: alloc.origin, destination: alloc.destination, status:'assigned', assignedAt: nowStamp(), receivedAt:null, receivedRemarks:'', returnRemarks:''});
  logTx(lock, 'assigned', '');
  await storageSet('st:locks', state.locks);
  state.assignForm.lockId = '';
  state.assignForm.plate = '';
  pushToast(`Lock ${lock.lockNo} assigned to ${plate} → ${alloc.destination} (${used+1}/${alloc.qty}).`, 'ok');
  render();
}

async function submitEditLock(id){
  const l = state.locks.find(x=>x.id===id);
  if(!l) return;
  const lockNo = document.getElementById('editLockNo').value.trim();
  if(!lockNo){ pushToast('Lock number is required.', 'err'); return; }
  const status = document.getElementById('editStatus').value;
  const newPlate = l.status==='available' ? '' : normalizePlate(document.getElementById('editPlate').value);
  const changes = [];
  if(lockNo !== l.lockNo) changes.push(`Lock no ${l.lockNo} → ${lockNo}`);
  if(status !== l.status) changes.push(`Status ${l.status} → ${status}`);
  if(newPlate !== (l.plate||'')) changes.push(`Plate ${l.plate||'—'} → ${newPlate||'—'}`);
  if(changes.length) logTx(l, 'edited', changes.join('; '));
  l.lockNo = lockNo;
  l.plate = normalizePlate(document.getElementById('editPlate').value);
  if(l.status==='available'){ l.plate=''; l.origin=''; }
  if(status !== l.status){
    l.status = status;
    if(status==='assigned' && !l.assignedAt) l.assignedAt = nowStamp();
    if(status==='received' && !l.receivedAt) l.receivedAt = nowStamp();
    if(status==='returning' && !l.returnStartedAt) l.returnStartedAt = nowStamp();
    if(status==='available'){ Object.assign(l,{agency:'',plate:'',origin:'',destination:'',assignedAt:null,receivedAt:null,receivedRemarks:'',returnStartedAt:null}); }
  }
  await storageSet('st:locks', state.locks);
  closeModal();
  pushToast('Lock updated.', 'ok');
}

  return modalShell('Bulk upload agency / plate / route list', 'Add many agency-plate-route entries at once.', body, footer);

function downloadRouteTemplate(){
  const ws = XLSX.utils.json_to_sheet([{Agency:'', Plate:'', Origin:'', Destination:''}]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, 'spx_truck_lock_gps_route_template.xlsx');
}
async function submitBulkRoutes(){
  const fileInput = document.getElementById('bulkRouteFile');
  if(!fileInput.files || !fileInput.files[0]){ pushToast('Please choose a file to upload.', 'err'); return; }
  try{
    const rows = await extractRowsFromFile(fileInput.files[0]);
    if(rows.length===0){ pushToast('No rows found in that file.', 'err'); return; }
    const headerMap = mapHeaders(Object.keys(rows[0]), {
      agency:['agency','agency name'],
      plate:['plate','plate no','plate number','truck plate','plate #'],
      origin:['origin','from','origin point'],
      destination:['destination','to','dest']
    });
    let added=0;
    rows.forEach(row=>{
      const agency = String(row[headerMap.agency]||'').trim();
      const plate = String(row[headerMap.plate]||'').trim();
      const origin = String(row[headerMap.origin]||'').trim();
      const destination = String(row[headerMap.destination]||'').trim();
      if(!agency && !plate && !origin && !destination) return;
      state.routes.push({id: genId('rt'), agency, plate, origin, destination, createdAt: nowStamp()});
      added++;
    });
    await storageSet('st:routes', state.routes);
    closeModal();
    pushToast(`${added} route(s) added to master data.`, 'ok');
  }catch(e){
    pushToast('Could not read that file. Please check the format.', 'err');
  }
}
function mapHeaders(headers, wanted){
  const lower = headers.map(h=>String(h).trim().toLowerCase());
  const result = {};
  Object.keys(wanted).forEach(key=>{
    let idx = -1;
    for(const cand of wanted[key]){
      idx = lower.indexOf(cand);
      if(idx>-1) break;
    }
    result[key] = idx>-1 ? headers[idx] : headers[0];
  });
  return result;
}
function extractRowsFromFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, {defval:''}));
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

/* ---------------- Export ---------------- */
function exportData(scope, format){
  state.exportMenuOpen = null;
  let rows = [];
  let filename = 'spx_truck_lock_gps_export';
  if(scope === 'locks'){
    const base = lockTableBase();
    const list = applyFilters(base);
    rows = list.map(l=>({
      'Lock No': l.lockNo,
      'Status': ({available:'Available',assigned:'In-transit',received:'Received',returning:'Returning to origin'})[l.status]||l.status,
      'Agency': l.agency||'',
      'Plate No': l.plate||'',
      'Origin': l.origin||'',
      'Destination': l.destination||'',
      'Assigned Date': l.assignedAt ? fmtDate(l.assignedAt) : '',
      'Received Date': l.receivedAt ? fmtDate(l.receivedAt) : '',
      'Receive Remarks': l.receivedRemarks || ''
    }));
    filename = 'gps_locks_export';
  } else if(scope === 'routes'){
    rows = state.routes.map(r=>({Agency:r.agency, Plate:r.plate, Origin:r.origin, Destination:r.destination}));
    filename = 'master_route_list';
  }
  if(scope === 'allocation'){
    const out = [];
    buildAllocationRows().forEach(r=>{
      out.push({
        'Origin': r.origin||'', 'Destination': r.destination, 'Agency': r.agency,
        'Lock Qty Allocated': r.qty===null ? '' : r.qty,
        'Locks Assigned': r.locks.length,
        'Balance': r.qty===null ? '' : r.qty - r.locks.length,
        'Lock Numbers': r.all.map(l=>l.lockNo).join(', '),
        'Reserved (not assigned)': r.reserved.map(l=>l.lockNo).join(', ')
      });
    });
    rows = out; filename = 'allocation_export';
  }
  if(scope === 'repository'){
    rows = repoFiltered().map(e=>({
      'Date': fmtDate(e.ts), 'Lock No': e.lockNo, 'Transaction': TX_LABELS[e.action]||e.action,
      'Destination': e.destination||'', 'Agency': e.agency||'', 'Plate No': e.plate||'', 'Origin': e.origin||'',
      'Remarks': e.remarks||'', 'By': e.by||''
    }));
    filename = 'spx_truck_lock_gps_repository';
  }
  if(rows.length===0){
    pushToast('Nothing to export yet.', 'err');
    render();
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  if(format==='xlsx'){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data');
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    const csv = XLSX.utils.sheet_to_csv(ws);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  pushToast('Export ready — check your downloads.', 'ok');
  render();
}

const TX_LABELS = {added:'Added to stock', assigned:'Assigned', received:'Received at destination', return_started:'Return to origin started', back_at_origin:'Received back at origin', released:'Released to available', edited:'Edited', deleted:'Deleted'};
const TX_BADGE = {added:'badge-available', assigned:'badge-assigned', received:'badge-received', return_started:'badge-returning', back_at_origin:'badge-received', released:'badge-noquota', edited:'badge-noquota', deleted:'badge-noquota'};
function logTx(l, action, remarks){
  const u = state.currentUser || {};
  state.txlogs.push({id:genId('tx'), ts:nowStamp(), lockId:l.id, lockNo:l.lockNo, action,
    agency:l.agency||'', plate:l.plate||'', origin:l.origin||'', destination:l.destination||'',
    remarks:String(remarks||'').trim(), by:u.username||'', role:u.role||''});
  if(state.txlogs.length > 20000) state.txlogs.splice(0, state.txlogs.length - 20000);
}

/* ---------------- Allocation module ---------------- */
function allocKey(d,a){ return (d||'').trim().toLowerCase() + '||' + (a||'').trim().toLowerCase(); }
function findAllocation(dest, agency){
  return state.allocations.find(a=>allocKey(a.destination,a.agency)===allocKey(dest,agency)) || null;
}
function lockById(id){ return state.locks.find(l=>l.id===id); }
function allocLocks(a){ return (a.lockIds||[]).map(lockById).filter(Boolean); }
function allocUsedCount(dest, agency){
  const k = allocKey(dest,agency);
  return state.locks.filter(l=>(l.status==='assigned'||l.status==='received'||l.status==='returning') && allocKey(l.destination,l.agency)===k).length;
}
function reservationOf(lockId){ return state.allocations.find(a=>(a.lockIds||[]).includes(lockId)) || null; }
function allocPendingReserved(a){ return allocLocks(a).filter(l=>l.status==='available').length; }
function allocBalanceList(){
  return state.allocations.map(a=>({a, left: a.qty - allocUsedCount(a.destination,a.agency), pending: allocPendingReserved(a)}))
    .sort((x,y)=>x.a.destination.localeCompare(y.a.destination)||x.a.agency.localeCompare(y.a.agency));
}
function parseLockNos(text){
  const seen = new Set(), out = [];
  String(text==null?'':text).split(/[\n\r,;\t]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
    const k = n.toLowerCase(); if(!seen.has(k)){ seen.add(k); out.push(n); }
  });
  return out;
}
// Resolve lock numbers against GPS Locks stock and make sure they can belong to this destination + agency.
function resolveLockNos(nos, destination, agency, excludeAllocId){
  const ids = [], errors = [], seen = new Set();
  const pairKey = allocKey(destination, agency);
  nos.forEach(no=>{
    const l = state.locks.find(x=>String(x.lockNo).toLowerCase()===no.toLowerCase());
    if(!l){ errors.push(`${no}: not found in Truck Lock Assigning`); return; }
    if(seen.has(l.id)) return;
    seen.add(l.id);
    if(l.status!=='available' && allocKey(l.destination,l.agency)!==pairKey){
      errors.push(`${no}: already assigned to ${l.agency} → ${l.destination}`); return;
    }
    const r = reservationOf(l.id);
    if(r && r.id!==excludeAllocId && allocKey(r.destination,r.agency)!==pairKey){
      errors.push(`${no}: already allocated to ${r.agency} → ${r.destination}`); return;
    }
    ids.push(l.id);
  });
  return {ids, errors};
}
function errSummary(errors){
  return errors.slice(0,3).join('; ') + (errors.length>3 ? ` (+${errors.length-3} more)` : '');
}

function buildAllocationRows(){
  const isAdmin = state.currentUser.role === 'admin';
  const map = new Map();
  state.allocations.forEach(a=>{
    map.set(allocKey(a.destination,a.agency), {allocId:a.id, origin:a.origin||'', destination:a.destination, agency:a.agency, qty:a.qty,
      locks:[], reserved: allocLocks(a).filter(l=>l.status==='available')});
  });
  state.locks.forEach(l=>{
    if(!l.destination || !l.agency) return;
    if(l.status!=='assigned' && l.status!=='received' && l.status!=='returning') return;
    const k = allocKey(l.destination,l.agency);
    if(!map.has(k)) map.set(k, {allocId:null, origin:l.origin||'', destination:l.destination, agency:l.agency, qty:null, locks:[], reserved:[]});
    map.get(k).locks.push(l);
  });
  let rows = Array.from(map.values());
  if(!isAdmin) rows = rows.filter(r=> isOriginStaff() ? sameStr(r.origin, state.currentUser.origin) : r.destination===state.currentUser.destination);
  const f = state.allocFilters;
  if(f.destination!=='all') rows = rows.filter(r=>r.destination===f.destination);
  const byNo = (a,b)=>a.lockNo.localeCompare(b.lockNo,undefined,{numeric:true});
  rows.forEach(r=>{ r.locks.sort(byNo); r.reserved.sort(byNo); r.all = [...r.locks, ...r.reserved].sort(byNo); });
  if(f.search){
    const q = f.search.toLowerCase();
    rows = rows.filter(r=>((r.origin||'')+' '+r.destination+' '+r.agency+' '+r.all.map(l=>l.lockNo).join(' ')).toLowerCase().includes(q));
  }
  return rows.sort((a,b)=>a.destination.localeCompare(b.destination) || a.agency.localeCompare(b.agency));
}

async function submitAddAlloc(){
  const destination = document.getElementById('allocDest').value.trim();
  const agency = document.getElementById('allocAgency').value.trim();
  const qtyRaw = document.getElementById('allocQty').value.trim();
  const origin = document.getElementById('allocOrigin').value.trim();
  const nos = parseLockNos(document.getElementById('allocLockNos').value);
  if(!destination || !agency || !origin){ pushToast('Enter origin, destination and agency.', 'err'); return; }
  const ex = findAllocation(destination, agency);
  const {ids, errors} = resolveLockNos(nos, destination, agency, ex?ex.id:null);
  if(errors.length){ pushToast('Lock number issue — ' + errSummary(errors), 'err'); return; }
  const existingIds = ex ? (ex.lockIds||[]).filter(id=>lockById(id)) : [];
  const merged = Array.from(new Set([...existingIds, ...ids]));
  let qty;
  if(qtyRaw===''){
    if(!ex && merged.length===0){ pushToast('Enter a quantity or at least one lock number.', 'err'); return; }
    qty = ex ? Math.max(ex.qty, merged.length) : merged.length;
  } else {
    qty = Number(qtyRaw);
    if(!Number.isInteger(qty) || qty<0){ pushToast('Enter a valid whole-number quantity.', 'err'); return; }
  }
  if(qty < merged.length){ pushToast(`Quantity ${qty} is less than the ${merged.length} lock number(s) listed.`, 'err'); return; }
  if(ex){
    const usedNow = allocUsedCount(ex.destination, ex.agency);
    if(qty < usedNow){ pushToast(`Cannot set below ${usedNow} — that many locks are already assigned.`, 'err'); return; }
    ex.qty = qty; ex.origin = origin; ex.lockIds = merged; ex.updatedAt = nowStamp();
    pushToast('Existing allocation updated.', 'ok');
  } else {
    state.allocations.push({id:genId('al'), origin, destination, agency, qty, lockIds: merged, createdAt: nowStamp()});
    pushToast('Allocation added.', 'ok');
  }
  await storageSet('st:allocations', state.allocations);
  closeModal();
}

async function submitEditAlloc(id){
  const a = state.allocations.find(x=>x.id===id);
  if(!a) return;
  const destination = document.getElementById('allocDest').value.trim();
  const agency = document.getElementById('allocAgency').value.trim();
  const qtyRaw = document.getElementById('allocQty').value.trim();
  const origin = document.getElementById('allocOrigin').value.trim();
  const nos = parseLockNos(document.getElementById('allocLockNos').value);
  if(!destination || !agency || !origin){ pushToast('Enter origin, destination and agency.', 'err'); return; }
  if(state.allocations.some(x=>x.id!==id && allocKey(x.destination,x.agency)===allocKey(destination,agency))){ pushToast('That destination and agency already has an allocation.', 'err'); return; }
  const usedNow = allocUsedCount(a.destination, a.agency);
  if(usedNow>0 && allocKey(destination,agency)!==allocKey(a.destination,a.agency)){ pushToast(`Destination/agency can't change while ${usedNow} lock(s) are assigned to it.`, 'err'); return; }
  const {ids, errors} = resolveLockNos(nos, destination, agency, id);
  if(errors.length){ pushToast('Lock number issue — ' + errSummary(errors), 'err'); return; }
  const dropped = allocLocks(a).filter(l=>l.status!=='available' && !ids.includes(l.id));
  if(dropped.length){ pushToast(`${dropped.map(l=>l.lockNo).slice(0,3).join(', ')} already assigned — can't be removed from this allocation.`, 'err'); return; }
  const qty = qtyRaw==='' ? ids.length : Number(qtyRaw);
  if(!Number.isInteger(qty) || qty<0){ pushToast('Enter a valid whole-number quantity.', 'err'); return; }
  if(qty < ids.length){ pushToast(`Quantity ${qty} is less than the ${ids.length} lock number(s) listed.`, 'err'); return; }
  if(qty < usedNow){ pushToast(`Cannot set below ${usedNow} — that many locks are already assigned.`, 'err'); return; }
  Object.assign(a,{origin,destination,agency,qty,lockIds:ids,updatedAt:nowStamp()});
  await storageSet('st:allocations', state.allocations);
  closeModal();
  pushToast('Allocation updated.', 'ok');
}
async function deleteAlloc(id){
  const a = state.allocations.find(x=>x.id===id);
  if(!a) return;
  const usedNow = allocUsedCount(a.destination, a.agency);
  if(usedNow>0){ pushToast(`Can't delete: ${usedNow} lock(s) are assigned to ${a.agency} → ${a.destination}. Release them first.`, 'err'); return; }
  if(!confirm(`Delete allocation for ${a.agency} → ${a.destination}? Its reserved lock numbers are released.`)) return;
  state.allocations = state.allocations.filter(x=>x.id!==id);
  await storageSet('st:allocations', state.allocations);
  pushToast('Allocation deleted.', 'ok');
  render();
}

    <p class="helper-text">Origin is looked up by Truck Lock Assigning, so include it for new allocations. Qty is optional when lock numbers are given (it becomes the lock count; for an existing allocation it never drops below what's there). Lock numbers are <b>added</b> to an existing allocation, must already exist as Available in Truck Lock Assigning, and can't belong to another destination/agency. Rejected lock numbers are skipped and reported.</p>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="submitBulkAlloc()">Upload allocations</button>`;
  return modalShell('Bulk upload allocations', 'Add or update origin, destination, agency, quantity and lock numbers.', body, footer);
}
function downloadAllocTemplate(){
  const ws = XLSX.utils.json_to_sheet([
    {Origin:'Manila Port', Destination:'Cebu Warehouse', Agency:'Metro Freight', Qty:50, 'Lock No':'GPS-000123'},
    {Origin:'Manila Port', Destination:'Cebu Warehouse', Agency:'Metro Freight', Qty:'', 'Lock No':'GPS-000124'}
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, 'spx_truck_lock_gps_allocation_template.xlsx');
}
function findAllocCol(headers, cands){
  const lower = headers.map(h=>String(h).trim().toLowerCase());
  for(const c of cands){ const i = lower.indexOf(c); if(i>-1) return headers[i]; }
  return null;
}
async function submitBulkAlloc(){
  const fileInput = document.getElementById('bulkAllocFile');
  const text = document.getElementById('bulkAllocText').value;
  let entries = [];
  try{
    if(fileInput && fileInput.files && fileInput.files[0]){
      const rows = await extractRowsFromFile(fileInput.files[0]);
      if(rows.length){
        const hs = Object.keys(rows[0]);
        let O = findAllocCol(hs, ['origin','from','origin name']);
        let D = findAllocCol(hs, ['destination','dest','to']);
        let A = findAllocCol(hs, ['agency','agency name']);
        let Q = findAllocCol(hs, ['qty','quantity','lock qty allocated','lock qty','allocated','allocation','qty allocated']);
        let L = findAllocCol(hs, ['lock no','lock no.','lock number','lock numbers','lock nos','lock','gps lock no','gps lock','serial no','serial']);
        if(!D && !A){ O=hs[0]; D=hs[1]; A=hs[2]; Q=hs[3]||null; L=hs[4]||null; } // no recognised headers: Origin, Destination, Agency, Qty, Lock No
        rows.forEach(r=>entries.push({o:O?String(r[O]??'').trim():'', d:D?String(r[D]??'').trim():'', a:A?String(r[A]??'').trim():'', q:Q?r[Q]:'', l:L?r[L]:''}));
      }
    }
  }catch(e){
    pushToast('Could not read that file. Please check the format.', 'err');
    return;
  }
  if(text.trim()){
    text.split(/\n+/).forEach(line=>{
      if(!line.trim()) return;
      const parts = line.split(/\t|,/).map(x=>x.trim());
      entries.push({o:parts[0]||'', d:parts[1]||'', a:parts[2]||'', q:parts[3]||'', l:parts.slice(4).join(',')});
    });
  }
  entries = entries.filter(e=>e.o || e.d || e.a || String(e.q).trim() || String(e.l).trim());
  if(entries.length===0){ pushToast('No allocation rows found to upload.', 'err'); return; }

  const groups = new Map();
  let skipped = 0;
  entries.forEach(e=>{
    const qStr = String(e.q==null?'':e.q).replace(/,/g,'').trim();
    const nos = parseLockNos(e.l);
    let qty = null;
    if(qStr!==''){
      qty = Number(qStr);
      if(!Number.isInteger(qty) || qty<0){ skipped++; return; }
    }
    if(!e.d || !e.a || (qty===null && nos.length===0)){ skipped++; return; }
    const k = allocKey(e.d,e.a);
    if(!groups.has(k)) groups.set(k, {origin:'', destination:e.d, agency:e.a, qty:null, nos:[]});
    const g = groups.get(k);
    if(e.o) g.origin = e.o;
    if(qty!==null) g.qty = qty;
    nos.forEach(n=>{ if(!g.nos.some(x=>x.toLowerCase()===n.toLowerCase())) g.nos.push(n); });
  });

  let added=0, updated=0, belowUsed=0, belowLocks=0, lockCount=0, noOrigin=0;
  const lockErrors = [];
  groups.forEach(g=>{
    const ex = findAllocation(g.destination, g.agency);
    const {ids, errors} = resolveLockNos(g.nos, g.destination, g.agency, ex?ex.id:null);
    errors.forEach(er=>lockErrors.push(er));
    const existingIds = ex ? (ex.lockIds||[]).filter(id=>lockById(id)) : [];
    const merged = Array.from(new Set([...existingIds, ...ids]));
    if(!ex && g.qty===null && merged.length===0){ skipped++; return; }
    const qty = g.qty!==null ? g.qty : (ex ? Math.max(ex.qty, merged.length) : merged.length);
    if(qty < merged.length){ belowLocks++; return; }
    if(ex && qty < allocUsedCount(ex.destination, ex.agency)){ belowUsed++; return; }
    lockCount += merged.length - existingIds.length;
    if(ex){ ex.qty = qty; ex.lockIds = merged; if(g.origin) ex.origin = g.origin; ex.updatedAt = nowStamp(); updated++; if(!ex.origin) noOrigin++; }
    else { state.allocations.push({id:genId('al'), origin:g.origin, destination:g.destination, agency:g.agency, qty, lockIds:merged, createdAt:nowStamp()}); added++; if(!g.origin) noOrigin++; }
  });
  if(added+updated===0){
    const why = [];
    if(belowLocks) why.push(`${belowLocks} group(s): qty less than lock numbers listed`);
    if(belowUsed) why.push(`${belowUsed} group(s): qty below locks already assigned`);
    if(lockErrors.length) why.push(errSummary(lockErrors));
    pushToast('Nothing uploaded. ' + (why.join('; ') || `${skipped} row(s) invalid — need destination, agency, and a qty or lock no.`), 'err');
    return;
  }
  await storageSet('st:allocations', state.allocations);
  closeModal();
  const extra = [];
  if(skipped) extra.push(`${skipped} invalid row(s) skipped`);
  if(belowLocks) extra.push(`${belowLocks} skipped (qty < lock numbers)`);
  if(belowUsed) extra.push(`${belowUsed} skipped (qty < assigned)`);
  if(noOrigin) extra.push(`${noOrigin} allocation(s) have no origin yet — add one before assigning`);
  if(lockErrors.length) extra.push(`${lockErrors.length} lock no. rejected — ${errSummary(lockErrors)}`);
  pushToast(`${added} added, ${updated} updated, ${lockCount} lock no. reserved.` + (extra.length ? ' ' + extra.join('; ') + '.' : ''), extra.length ? 'err' : 'ok');
}

function modalViewAllocLocks(dest, agency){
  const a = findAllocation(dest, agency);
  const k = allocKey(dest, agency);
  const reserved = a ? allocLocks(a).filter(l=>l.status==='available') : [];
  const active = state.locks.filter(l=>(l.status==='assigned'||l.status==='received'||l.status==='returning') && allocKey(l.destination,l.agency)===k);
  const locks = [...active, ...reserved].sort((x,y)=>x.lockNo.localeCompare(y.lockNo,undefined,{numeric:true}));
  const body = `
    <p class="helper-text" style="margin:0 0 10px;">${active.length} assigned, ${reserved.length} reserved (not assigned yet).</p>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Lock No.</th><th>Status</th><th>Plate</th><th>Assigned</th></tr></thead>
      <tbody>${locks.map((l,i)=>`<tr><td>${i+1}</td><td class="mono">${escapeHtml(l.lockNo)}</td><td>${l.status==='available' ? '<span class="badge badge-available">Reserved</span>' : statusBadge(l.status)}</td><td class="mono">${escapeHtml(l.plate||'—')}</td><td>${l.assignedAt?fmtDate(l.assignedAt):'—'}</td></tr>`).join('')}</tbody>
    </table></div>`;
  return modalShell('Lock numbers', `${escapeHtml(agency)} → ${escapeHtml(dest)}`, body, `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`);
}

initApp();
